# Local default profile (Tilt test-engine/test-ai and manual `cargo nextest run`).
#
# fail-fast = false: with concurrent agents working in the tree, one in-progress
# failure must not cancel the rest of the run — a red resource should report
# "N failed, here's which" over the full suite, not abandon thousands of tests
# after the first failure.
[profile.default]
fail-fast = false

# CI test profile (activated with `cargo nextest run --profile ci`).
#
# nextest already defaults test-threads to the number of logical CPUs, so this
# profile does NOT raise per-runner parallelism — the CI speedup comes from
# sharding the test run across multiple runners (see the rust-test matrix in
# .github/workflows/ci.yml). This profile adds two CI-appropriate behaviors:
#   - fail-fast = false: a shard reports every failure, not just the first one.
#   - slow-timeout: warn on any test running past 60s and hard-kill it after
#     4 periods (240s) as a runaway/hang guard. Every legitimate test but the
#     one overridden below finishes well inside that.
[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 4 }

# `loop_shortcut::an_evicting_beat_mints_without_growing_the_ring` drives a four-player
# Commander dump with a large stack through production `apply()` until the loop-detect ring
# evicts, stopping at that first evicting beat rather than at its 120-beat cap. Profiled: the
# test-side work (the per-beat snapshot clone and the ring-membership scans) is negligible, and
# the cost is the CR 732.2a shortcut detector's reconcile seam inside `apply()` — essentially
# all of it, with both sampler halves together under a third of one percent. Re-derive that
# attribution rather than trusting this sentence, with the instrument that measures it. The
# instrument PRINTS its attribution, so `--no-capture` is part of the command, not a taste:
# without it the run is a green PASS and no attribution at all.
#   cargo nextest run -p phase-engine --cargo-profile server-release --run-ignored all \
#     --no-capture -E 'test(=loop_shortcut::the_detector_cost_attributes_to_its_named_parts)'
# No cheaper stand-in exists among the tracked fixtures: driven to 120 beats under a forced
# `LoopDetectionMode::Interactive`, no other dump in `crates/engine/tests/fixtures` that
# `restore_dump` accepts reaches `LOOP_DETECT_RING_CAP` — forced because several of those dumps
# carry `loop_detection: Off`. Re-derive over that same population and beat bound: drive each
# accepted dump through `dump_drive_one_beat` and print its maximum ring.
#
# THE MEASURED RESIDUE THIS OVERRIDE EXISTS FOR, read off THIS ROW's own runtime rather than
# off a shard aggregate: in full local `--profile ci` suite runs the row has measured 233-243s
# against the 240s kill. It straddles the kill, so on this machine the override is already
# what keeps the row green — never mind that a CI runner is slower still, which is where it
# was first observed (PR #8301). Re-read the number off the row's own PASS line in such a run;
# the default status level prints it and CI's `--status-level fail` is what hides it. A
# single-test or single-shard run reads far lower and will make this override look unearned:
# the full suite is the leg that decides. WHICH SHARD carries the row is not a constant and no
# number here would stay true — partition assignment depends on the WHOLE test list, so a
# listing over any other population, an `-E` filter or a different feature set alike, names a
# different shard. Derive it unfiltered over the population CI archives:
#   cargo nextest list --profile ci --workspace --exclude phase-tauri \
#     --features engine/proptest --partition count:N/4
# Re-measure before assuming this override is still earned.
#
# What this override does and nothing more: it raises the hard kill for this one test to ten
# 60s periods. The test stays in the 60s slow-warn population, which is the signal to keep.
[[profile.ci.overrides]]
filter = 'test(=loop_shortcut::an_evicting_beat_mints_without_growing_the_ring)'
slow-timeout = { period = "60s", terminate-after = 10 }
