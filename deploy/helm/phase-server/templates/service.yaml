apiVersion: v1
kind: Service
metadata:
  name: {{ include "phase-server.fullname" . }}
  labels:
    {{- include "phase-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
    {{- if .Values.logging.enabled }}
    - name: logs
      port: {{ .Values.logging.server.port }}
      targetPort: logs
      protocol: TCP
    {{- end }}
    {{- if .Values.web.enabled }}
    - name: web
      port: {{ .Values.web.server.port }}
      targetPort: web
      protocol: TCP
    {{- end }}
  selector:
    {{- include "phase-server.selectorLabels" . | nindent 4 }}
