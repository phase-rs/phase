{{- if .Values.web.enabled }}
{{- /* nginx config + runtime config for the SPA sidecar in phase-server.podSpec.
     Both live in a ConfigMap rather than the image so they stay generic across
     whatever web.image.repository is set to, and so a change to either rolls
     the pods through the checksum/web-config annotation.

     This deliberately diverges from the logs sidecar's nginx.conf: that one
     autoindexes plain text for an operator on loopback, this one serves a
     single-page application to the public. Every difference below is load
     bearing, so none of it should be "simplified" back toward that file. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "phase-server.fullname" . }}-web-conf
  labels:
    {{- include "phase-server.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    events {
      worker_connections 256;
    }
    http {
      # The logs sidecar omits this because autoindexed text does not care.
      # Without it every asset is served as text/plain: index.html renders as
      # source, `type="module"` scripts are refused on MIME grounds, and the
      # locally bundled .wasm fails WebAssembly.instantiateStreaming.
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      access_log /dev/stdout;
      error_log /dev/stderr;
      sendfile on;

      server {
        # 0.0.0.0, unlike the logs sidecar's loopback bind: this one is the
        # public site. Unprivileged image, so the port must be >1024.
        listen 0.0.0.0:{{ .Values.web.server.port }};
        root /usr/share/nginx/html;
        index index.html;

        # Runtime configuration, served from the ConfigMap rather than from the
        # image's copy of the same path. This is what lets ONE generic image be
        # pointed at any server without a rebuild: the SPA reads it at startup
        # and falls back to its build-time default when it is absent or empty.
        # `root` here (not the html root above) is the whole mechanism; nothing
        # is mounted over the image's own file, so the image's interior layout
        # stays its own business.
        location = /config.js {
          root /etc/phase-web;
          # =404 rather than falling through to the SPA fallback below: without
          # it a missing config.js returns index.html as text/html, which the
          # nosniff header then blocks on MIME grounds — a failure that reads as
          # a MIME error instead of a missing file.
          try_files /config.js =404;
          add_header Cache-Control "public, max-age=0, must-revalidate" always;
        }

        # A missing service worker must 404, never fall through to HTML.
        location = /sw.js {
          try_files $uri =404;
          add_header Cache-Control "public, max-age=0, must-revalidate" always;
        }

        # Content-addressed filenames: safe to cache forever, and `immutable`
        # skips revalidation even on reload. Mirrors
        # client/deploy/cloudflare-pages/_headers.
        location /assets/ {
          try_files $uri =404;
          add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Entry points that decide which bundle the user lands on. A stale copy
        # strands them on an old build until a manual hard refresh.
        location ~ ^/(index\.html|registerSW\.js|manifest\.webmanifest|workbox-[^/]+\.js)$ {
          try_files $uri =404;
          add_header Cache-Control "public, max-age=0, must-revalidate" always;
        }

        # The client is a BrowserRouter with real history paths, so every deep
        # link and every reload off / must resolve to the app shell. No server
        # endpoint is routed here, so this cannot shadow one.
        location / {
          try_files $uri $uri/ /index.html;
          add_header Cache-Control "public, max-age=0, must-revalidate" always;
        }
      }
    }
  config.js: |
    // Runtime configuration for this deployment, served at /config.js and read
    // before the app bundle. Generated by the phase-server chart — edit
    // web.defaultMultiplayerServerUrl in values, not this file.
    {{- if .Values.web.defaultMultiplayerServerUrl }}
    window.__PHASE_CONFIG__ = {
      multiplayerServerUrl: {{ .Values.web.defaultMultiplayerServerUrl | quote }},
    };
    {{- else }}
    // No override configured: the SPA keeps its build-time default.
    window.__PHASE_CONFIG__ = {};
    {{- end }}
{{- end }}
