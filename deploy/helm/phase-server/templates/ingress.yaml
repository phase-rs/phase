{{- /* scaleOut arrives in a later commit; testing the map first keeps this file
     renderable on its own, and `.Values.scaleOut.enabled` alone is a nil
     dereference until then. `default` does not help — it still dereferences. */}}
{{- $scaleOut := false }}
{{- if .Values.scaleOut }}{{- $scaleOut = .Values.scaleOut.enabled }}{{- end }}
{{- if and .Values.ingress.enabled (not $scaleOut) }}
{{- $fullname := include "phase-server.fullname" . }}
{{- /* Both the rule host and the TLS SAN come from this one value. Empty renders
     `host:` and a `tls.hosts` entry of "", which Traefik accepts as a catch-all
     router and cert-manager turns into a Certificate with no dnsNames — a silent
     misconfiguration, so fail rendering instead. */}}
{{- $host := required "ingress.host is required when ingress.enabled is true (it is the hostname the router matches and the certificate is issued for)." .Values.ingress.host }}
{{- $common := include "phase-server.commonMiddlewares" (dict "ctx" . "excludeCompress" false) }}
{{- /* /ws gets every other common middleware but skips compress — see
     `phase-server.commonMiddlewares` for why. */}}
{{- $wsMw := include "phase-server.commonMiddlewares" (dict "ctx" . "excludeCompress" true) }}
{{- $backupMw := $common }}
{{- if .Values.traefik.middlewares.enabled }}
{{- $backupMw = printf "%s,%s,%s" (include "phase-server.crdRef" (dict "ctx" . "suffix" "backup-ratelimit")) (include "phase-server.crdRef" (dict "ctx" . "suffix" "backup-buffering")) $common }}
{{- end }}
{{- /* One Ingress per middleware set: /health, /ws (its own set so compress
     can be excluded from it alone), and the backup API. Only the first
     carries the cert-manager annotation so ingress-shim manages one
     Certificate for the shared secret. */}}
{{- /* The SPA's catch-all. Last in the list so the three endpoint routes above
     keep their positions; ordering between Ingress objects does not decide
     matching anyway — the Ingress spec is longest-prefix, so /health, /ws and
     /p2p-draft-backup still win over "/". Without this route the default
     topology would render a web sidecar and a Service port with nothing
     pointing at them. */}}
{{- /* `/admin/*` is deliberately absent. It is mounted by the server only when an
     admin token is set, and its bearer guard is authentication, not a reason to
     move the documented network boundary: the chart keeps it reachable only
     through `kubectl port-forward`. With the SPA on the catch-all an /admin
     request therefore lands on the site and 404s, which is the intended answer
     from the public edge. `tests/assert-web-routing.sh` asserts its absence with
     a token configured, in both topologies. */}}
{{- $routes := list
      (dict "suffix" "" "paths" (list "/health") "mw" $common "port" "http")
      (dict "suffix" "-ws" "paths" (list "/ws") "mw" $wsMw "port" "http")
      (dict "suffix" "-backup" "paths" (list "/p2p-draft-backup") "mw" $backupMw "port" "http") }}
{{- if .Values.web.enabled }}
{{- $webMw := include "phase-server.commonMiddlewares" (dict "ctx" . "excludeCompress" false "excludeRateLimit" true) }}
{{- $routes = append $routes (dict "suffix" "-web" "paths" (list "/") "mw" $webMw "port" "web") }}
{{- end }}
{{- range $i, $route := $routes }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}{{ $route.suffix }}
  labels:
    {{- include "phase-server.labels" $ | nindent 4 }}
  annotations:
    {{- include "phase-server.ingressAnnotations" $ | nindent 4 }}
    {{- if eq $i 0 }}
    {{- if $.Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $.Values.ingress.tls.clusterIssuer | quote }}
    {{- else if $.Values.ingress.tls.issuer }}
    cert-manager.io/issuer: {{ $.Values.ingress.tls.issuer | quote }}
    {{- end }}
    {{- end }}
    {{- if $route.mw }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ $route.mw | quote }}
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  tls:
    - hosts:
        - {{ $host }}
      secretName: {{ include "phase-server.tlsSecretName" $ }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          {{- range $p := $route.paths }}
          - path: {{ $p }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: {{ $route.port }}
          {{- end }}
{{- end }}
{{- end }}
