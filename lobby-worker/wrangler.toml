# Cloudflare Worker + Durable Object for the official phase.rs lobby broker.
#
# The DO body (src/lobby-do.ts) is a thin imperative shell around the compiled
# Rust `lobby-broker` core (lobby-worker/broker-wasm -> broker-wasm-pkg).
# All protocol parsing, dispatch, reservations, capacity caps, build-commit
# gating, and the staleness reaper live in Rust — the SAME code phase-server
# runs natively — so the two deployments behave identically by construction.

name = "phase-lobby"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Build the Rust broker to WASM (+ wasm-bindgen glue) before bundling. wrangler
# runs this on `wrangler deploy` and `wrangler dev`; the generated glue under
# broker-wasm-pkg/ is gitignored and regenerated. Requires the wasm32 target,
# wasm-bindgen-cli (0.2.121), and wasm-opt — the release workflow sets these up.
#
# Two rules keep `wrangler dev` from rebuilding itself in a loop. Both are
# load-bearing:
#
#   1. The glue lands in broker-wasm-pkg/ NEXT TO src/, never inside it.
#      wrangler re-runs this command whenever watch_dir changes, so output
#      written into a watched directory retriggers the watcher that produced
#      it. That is an unbounded loop, not merely a slow start. Keep any future
#      codegen out of the watched tree for the same reason.
#   2. watch_dir names the Rust build inputs, rather than the default ./src.
#      This includes the standalone crate, both path dependencies, and the
#      workspace/config inputs their manifests inherit. Worker TypeScript still
#      hot-reloads: wrangler watches the bundle's module graph for that,
#      independently. The only thing this suppresses is a pointless wasm
#      rebuild on every .ts save.
[build]
command = "bash ../scripts/build-broker-wasm.sh release"
watch_dir = [
  "broker-wasm/src",
  "broker-wasm/Cargo.toml",
  "broker-wasm/Cargo.lock",
  "broker-wasm/.cargo/config.toml",
  "../crates/lobby-broker/src",
  "../crates/lobby-broker/Cargo.toml",
  "../crates/engine/src",
  "../crates/engine/Cargo.toml",
  "../Cargo.toml",
  "../.cargo/config.toml",
  "../scripts/build-broker-wasm.sh",
]

# Single global lobby = one DO instance addressed by a fixed name ("global").
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDO"

# SQLite-backed DO class — REQUIRED for the Workers Free plan (KV-backed DOs
# need a paid plan). Also what WebSocket Hibernation + DO storage build on.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LobbyDO"]

# Analytics Engine dataset for client telemetry (`POST /telemetry`). Write-only,
# high-cardinality event store queried out-of-band via the SQL-over-HTTP API.
# AE is available on the Workers Free plan and is currently UNBILLED; Cloudflare
# has said pricing will be announced in advance, so a future billing change here
# is expected, not a surprise. The binding is optional in the Worker (`TELEMETRY?`)
# so a deploy without this stanza still serves the lobby — ingest just no-ops.
[[analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "phase_telemetry"

# Workers Logs — persistent logs in the dashboard Observability tab. We keep this
# ON for our structured console.* output: relay-mint failures surface via
# `console.error({event:"turn_mint_failed"})` in turn.ts (the always-on Workers
# *Metrics* view masks them — a handled `Response(502)` counts as a "Success"
# invocation). Those content logs are what matter, and they are captured
# regardless of `invocation_logs`.
#
# `invocation_logs = false`: the lobby is a WebSocket DO, so every inbound frame
# is its own invocation. With invocation logs ON, each frame emitted an empty
# `websocket:message` summary record (outcome+timing, no body) — one billable log
# per heartbeat against the 200k/day free-tier cap, for zero signal. Disabling
# them drops those envelopes while keeping every explicit console.* line. Per-
# invocation counts / CPU time / error rate remain visible in the free Metrics
# tab, which is a separate product from Logs.
#
# head_sampling_rate=1 keeps 100% of the (now rare, all-meaningful) content logs.
# `persist`/`traces` from the dashboard's exported blob are NOT documented
# wrangler keys and would fail deploy validation, so they are omitted.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

[vars]
# Cloudflare Realtime TURN key ID (NOT secret — useless without the API token,
# which is set via `wrangler secret put TURN_KEY_API_TOKEN`).
TURN_KEY_ID = "97c7984d6c155084f9d0fdf8090e02f8"
# Credential lifetime in seconds (Cloudflare max 48h). 24h covers any session.
TURN_TTL_SECONDS = "86400"
# Origin allowlist for the /turn-credentials fetch. "*" is fine during rollout
# (TURN creds are short-lived; worst case is quota use). Tighten for prod, e.g.
# "https://phase-rs.dev,http://localhost:5173".
ALLOWED_ORIGINS = "*"

# The TURN API token is a SECRET — never put it here. Set it with:
#   npx wrangler secret put TURN_KEY_API_TOKEN
# Until both TURN_KEY_ID and the secret are set, /turn-credentials returns 503
# and the client falls back to STUN-only (relay disabled for symmetric NAT).

# Test first on the automatic *.workers.dev URL (no config needed — just
# `wrangler deploy`). When ready to serve from your own domain (the phase-rs.dev
# zone is already on Cloudflare), uncomment this: `custom_domain = true` makes
# Workers auto-provision the DNS record + TLS cert. Endpoint becomes
# wss://lobby.phase-rs.dev/ws. Do NOT point the production default at it until
# the real Rust broker is in (keep phase-server as DEFAULT_SERVER until cutover).
# [[routes]]
# pattern = "lobby.phase-rs.dev"
# custom_domain = true

# ── Preview environment ────────────────────────────────────────────────────
# A SECOND Worker script (`phase-lobby-preview`) with its own Durable Object
# namespace, deployed from `main` on every staging deploy. It exists because one
# lobby physically cannot serve two client channels:
#
#   `ServerHello` is sent unprompted on connect (lobby-do.ts), BEFORE the client
#   sends `ClientHello` — see the `ws.onopen` comment in
#   client/src/services/openPhaseSocket.ts. The server therefore advertises one
#   protocol number, blind, to every caller. A released client accepts
#   [PROTOCOL_VERSION-1, PROTOCOL_VERSION] of ITS OWN build; once `main` is two
#   bumps ahead of the last release those two windows are disjoint and no single
#   advertised number satisfies both. Splitting the deployment is the only fix
#   that does not evict one channel to serve the other.
#
# Non-inheritable keys (vars, durable_objects, migrations, observability,
# analytics_engine_datasets) MUST be restated here — Wrangler does not inherit
# them into a named environment. `main` and [build] are inherited.
[env.preview]
name = "phase-lobby-preview"

[[env.preview.durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDO"

# Independent DO namespace from production: the preview lobby lists preview
# rooms only. Tag numbering is per-script, so this is also "v1".
[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["LobbyDO"]

[env.preview.observability]
enabled = true
head_sampling_rate = 1

[env.preview.observability.logs]
invocation_logs = false

# Separate dataset so preview traffic never pollutes production telemetry.
[[env.preview.analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "phase_telemetry_preview"

[env.preview.vars]
TURN_KEY_ID = "97c7984d6c155084f9d0fdf8090e02f8"
TURN_TTL_SECONDS = "86400"
ALLOWED_ORIGINS = "*"

# Stable hostname for the preview channel. `custom_domain = true` makes Workers
# provision the DNS record AND the TLS cert in the phase-rs.dev zone (already in
# this Cloudflare account), so no manual CNAME is required. The preview client
# build sets DEFAULT_MULTIPLAYER_SERVER_URL to wss://lobby-preview.phase-rs.dev/ws
# — see the "Build frontend" step in .github/workflows/deploy.yml.
[[env.preview.routes]]
pattern = "lobby-preview.phase-rs.dev"
custom_domain = true
