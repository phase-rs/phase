name: Essence Burn recovery evidence

on:
  push:
    branches: [codex/essence-burn-416]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: wasm32-unknown-unknown
          cache-shared-key: rust-debug

      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Generate card data from current Oracle input
        run: |
          set -euo pipefail
          ./scripts/gen-card-data.sh
          python3 scripts/gen-test-fixture.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          cards = json.loads(Path("client/public/card-data.json").read_text())
          card = cards["essence burn"]
          Path("essence-burn-card-data.json").write_text(
              json.dumps({"essence burn": card}, indent=2) + "\n"
          )
          print("Essence Burn card data excerpt created")
          PY
          git rev-parse HEAD > essence-burn-evidence-head.txt

      - name: Generate and check parser IR and lowered snapshots
        env:
          INSTA_UPDATE: always
        run: cargo test -p phase-parser parser::oracle_ir::snapshot_tests::essence_burn_ir_and_lowered

      - name: Run Essence Burn production integration tests
        run: cargo test -p phase-engine --test integration_3 --features test-support essence_burn

      - name: Upload generated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: essence-burn-recovery-evidence
          if-no-files-found: warn
          retention-days: 3
          path: |
            essence-burn-evidence-head.txt
            essence-burn-card-data.json
            client/public/coverage-data.json
            crates/engine/tests/fixtures/integration_cards.json.gz
            crates/phase-parser/src/parser/oracle_ir/snapshots/phase_parser__parser__oracle_ir__snapshot_tests__essence_burn_ir.snap
            crates/phase-parser/src/parser/oracle_ir/snapshots/phase_parser__parser__oracle_ir__snapshot_tests__essence_burn_lowered.snap
