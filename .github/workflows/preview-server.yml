name: Preview Server Artifacts

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      SERVER_ARTIFACT_MINISIGN_PRIVATE_KEY:
        required: true
    inputs:
      fingerprint:
        required: true
        type: string
      commit:
        required: true
        type: string
      card_data_sha256:
        required: true
        type: string
      card_data_hash16:
        required: true
        type: string
      draft_pools_sha256:
        required: true
        type: string
      draft_pools_hash16:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      fingerprint:
        description: Engine fingerprint (16 hex characters)
        required: true
        type: string
      commit:
        description: Commit whose server source is compiled
        required: true
        type: string
      card_data_sha256:
        description: SHA-256 of uncompressed card-data.json
        required: true
        type: string
      card_data_hash16:
        description: First 16 hex characters of card-data.json SHA-256
        required: true
        type: string
      draft_pools_sha256:
        description: SHA-256 of uncompressed draft-pools.json
        required: true
        type: string
      draft_pools_hash16:
        description: First 16 hex characters of draft-pools.json SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-server-${{ inputs.fingerprint }}
  cancel-in-progress: false

env:
  # The deploy caller needs card-data, so this window exists for
  # workflow_dispatch, which has no such edge. Four poll intervals: enough that
  # no single origin miss decides the verdict.
  DATA_WAIT_SECONDS: 120
  DATA_POLL_SECONDS: 30

jobs:
  gate:
    name: Skip published fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      already_published: ${{ steps.gate.outputs.already_published }}
    steps:
      - name: Check manifest membership
        id: gate
        env:
          FINGERPRINT: ${{ inputs.fingerprint }}
          COMMIT: ${{ inputs.commit }}
          CARD_DATA_SHA256: ${{ inputs.card_data_sha256 }}
          CARD_DATA_HASH16: ${{ inputs.card_data_hash16 }}
          DRAFT_POOLS_SHA256: ${{ inputs.draft_pools_sha256 }}
          DRAFT_POOLS_HASH16: ${{ inputs.draft_pools_hash16 }}
        run: |
          set -euo pipefail

          for value in "$FINGERPRINT" "$CARD_DATA_HASH16" "$DRAFT_POOLS_HASH16"; do
            if ! [[ "$value" =~ ^[0-9a-f]{16}$ ]]; then
              echo "::error::Expected a 16-character lowercase hex fingerprint, got: $value"
              exit 1
            fi
          done
          for value in "$CARD_DATA_SHA256" "$DRAFT_POOLS_SHA256"; do
            if ! [[ "$value" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Expected a 64-character lowercase SHA-256, got: $value"
              exit 1
            fi
          done
          if [[ "$CARD_DATA_SHA256" != "$CARD_DATA_HASH16"* || "$DRAFT_POOLS_SHA256" != "$DRAFT_POOLS_HASH16"* ]]; then
            echo "::error::Each data hash16 must be the first 16 characters of its SHA-256: the manifest names each data file by that prefix."
            exit 1
          fi
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected a 40-character lowercase commit SHA, got: $COMMIT"
            exit 1
          fi

          manifest=$(mktemp)
          status=$(curl -sS -o "$manifest" -w '%{http_code}' \
            --connect-timeout 5 --max-time 30 \
            https://data.phase-rs.dev/desktop/preview-server.json || true)
          case "$status" in
            200)
              jq -e 'type == "object" and (.fingerprints | type == "object")' "$manifest" >/dev/null
              if jq -e --arg fingerprint "$FINGERPRINT" '.fingerprints | has($fingerprint)' "$manifest" >/dev/null; then
                echo "already_published=true" >> "$GITHUB_OUTPUT"
                echo "Preview fingerprint $FINGERPRINT is already published."
              else
                echo "already_published=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            404)
              echo "already_published=false" >> "$GITHUB_OUTPUT"
              echo "Preview manifest does not exist yet."
              ;;
            *)
              echo "::error::Could not fetch preview manifest (HTTP ${status:-curl failure})."
              exit 1
              ;;
          esac

  build:
    name: Build preview server (${{ matrix.os }})
    needs: [gate]
    if: needs.gate.outputs.already_published != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    env:
      PHASE_CHANNEL: preview
      PHASE_ENGINE_FINGERPRINT: ${{ inputs.fingerprint }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            triple: x86_64-unknown-linux-musl
            extension: ""
            cargo_cmd: build
          - os: linux-arm64
            runner: ubuntu-latest
            triple: aarch64-unknown-linux-musl
            extension: ""
            cargo_cmd: zigbuild
          - os: macos
            runner: macos-latest
            triple: aarch64-apple-darwin
            extension: ""
            cargo_cmd: build
          - os: windows
            runner: windows-latest
            triple: x86_64-pc-windows-msvc
            extension: .exe
            cargo_cmd: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-shared-key: rust-server-${{ matrix.os }}

      - name: Install musl tools and target
        if: matrix.triple == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Install zig cross toolchain and target
        if: matrix.cargo_cmd == 'zigbuild'
        # --break-system-packages: ubuntu-latest is 24.04, whose default
        # Python is PEP 668 externally-managed since GitHub reverted its
        # pip workaround (actions/runner-images#10897, 2025-05-09). Same
        # flag the Dockerfile already passes for this identical install.
        run: |
          pip install --break-system-packages --require-hashes -r scripts/requirements-zigbuild.txt
          rustup target add ${{ matrix.triple }}

      - name: Build phase-server
        # -p scopes feature unification to phase-server's own dependency set;
        # an unscoped workspace build unifies feed-scraper's default-features
        # reqwest (native-tls -> openssl-sys) into the musl target and fails.
        run: cargo ${{ matrix.cargo_cmd }} -p phase-server --profile server-release --bin phase-server --target ${{ matrix.triple }}

      - name: Prepare preview server binary (Unix)
        if: matrix.os != 'windows'
        run: |
          cp "target/${{ matrix.triple }}/server-release/phase-server" "phase-server-${{ matrix.triple }}"
          chmod +x "phase-server-${{ matrix.triple }}"
        shell: bash

      - name: Prepare preview server binary (Windows)
        if: matrix.os == 'windows'
        run: |
          Copy-Item "target/${{ matrix.triple }}/server-release/phase-server.exe" "phase-server-${{ matrix.triple }}.exe"
        shell: pwsh

      - name: Upload preview server binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-server-${{ matrix.triple }}
          path: phase-server-${{ matrix.triple }}${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Sign, publish, and retain preview servers
    needs: [gate, build]
    if: needs.gate.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 46
    concurrency:
      group: preview-server-manifest
      cancel-in-progress: false
    env:
      FINGERPRINT: ${{ inputs.fingerprint }}
      COMMIT: ${{ inputs.commit }}
      CARD_DATA_SHA256: ${{ inputs.card_data_sha256 }}
      CARD_DATA_URL: https://data.phase-rs.dev/staging/card-data-${{ inputs.card_data_hash16 }}.json
      DRAFT_POOLS_SHA256: ${{ inputs.draft_pools_sha256 }}
      DRAFT_POOLS_URL: https://data.phase-rs.dev/staging/draft-pools-${{ inputs.draft_pools_hash16 }}.json
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SERVER_ARTIFACT_MINISIGN_PRIVATE_KEY: ${{ secrets.SERVER_ARTIFACT_MINISIGN_PRIVATE_KEY }}
    steps:
      - name: Re-check manifest membership under publication lock
        id: publication-gate
        run: |
          set -euo pipefail

          manifest=$(mktemp)
          trap 'rm -f "$manifest"' EXIT
          status=$(curl -sS -o "$manifest" -w '%{http_code}' \
            --connect-timeout 5 --max-time 30 \
            https://data.phase-rs.dev/desktop/preview-server.json || true)
          case "$status" in
            200)
              jq -e 'type == "object" and (.fingerprints | type == "object")' "$manifest" >/dev/null
              if jq -e --arg fingerprint "$FINGERPRINT" '.fingerprints | has($fingerprint)' "$manifest" >/dev/null; then
                echo "already_published=true" >> "$GITHUB_OUTPUT"
                echo "Preview fingerprint $FINGERPRINT was published while this job waited for the publication lock."
              else
                echo "already_published=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            404)
              echo "already_published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Could not fetch preview manifest after acquiring publication lock (HTTP ${status:-curl failure})."
              exit 1
              ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.publication-gate.outputs.already_published != 'true'
        with:
          persist-credentials: false

      - name: Wait for the data files the manifest names
        if: steps.publication-gate.outputs.already_published != 'true'
        # The deploy caller needs the job that uploads these, so there the check
        # confirms what the graph already ordered. A manual dispatch has no such
        # edge: the script times its own DATA_WAIT_SECONDS window from here, and
        # if it expires nothing is signed or published.
        run: bash scripts/wait-for-preview-data.sh "$CARD_DATA_URL" "$DRAFT_POOLS_URL"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.publication-gate.outputs.already_published != 'true'
        with:
          node-version: 22

      - name: Download Linux binary
        if: steps.publication-gate.outputs.already_published != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preview-server-x86_64-unknown-linux-musl
          path: artifacts/x86_64-unknown-linux-musl

      - name: Download Linux arm64 binary
        if: steps.publication-gate.outputs.already_published != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preview-server-aarch64-unknown-linux-musl
          path: artifacts/aarch64-unknown-linux-musl

      - name: Download macOS binary
        if: steps.publication-gate.outputs.already_published != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preview-server-aarch64-apple-darwin
          path: artifacts/aarch64-apple-darwin

      - name: Download Windows binary
        if: steps.publication-gate.outputs.already_published != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preview-server-x86_64-pc-windows-msvc
          path: artifacts/x86_64-pc-windows-msvc

      - name: Sign binaries, publish manifest, and garbage-collect old pairs
        if: steps.publication-gate.outputs.already_published != 'true'
        # The manifest is written last: nothing refers to a binary until its
        # detached signature exists. R2 retention tracks exactly its current and
        # previous fingerprint entries.
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y minisign

          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$SERVER_ARTIFACT_MINISIGN_PRIVATE_KEY" > "$key_file"

          sign() {
            printf '\n' | minisign -S -s "$key_file" -m "$1" -x "$1.minisig"
          }

          binaries=(
            artifacts/x86_64-unknown-linux-musl/phase-server-x86_64-unknown-linux-musl
            artifacts/aarch64-unknown-linux-musl/phase-server-aarch64-unknown-linux-musl
            artifacts/aarch64-apple-darwin/phase-server-aarch64-apple-darwin
            artifacts/x86_64-pc-windows-msvc/phase-server-x86_64-pc-windows-msvc.exe
          )
          for binary in "${binaries[@]}"; do
            test -s "$binary"
            sign "$binary"
          done

          prefix="desktop/preview-server/$FINGERPRINT"
          # Each binary is downloaded into a directory named for its target
          # triple, which is the key the manifest publishes it under.
          platform_of() { basename "$(dirname "$1")"; }

          declare -A sha256_of
          for binary in "${binaries[@]}"; do
            name=$(basename "$binary")
            npx wrangler r2 object put "phase-rs-data/$prefix/$name" --file "$binary" --remote --content-type application/octet-stream --cache-control "public, max-age=31536000, immutable"
            npx wrangler r2 object put "phase-rs-data/$prefix/$name.minisig" --file "$binary.minisig" --remote --content-type application/octet-stream --cache-control "public, max-age=31536000, immutable"
            sha256_of["$(platform_of "$binary")"]=$(sha256sum "$binary" | cut -d' ' -f1)
          done

          existing_manifest=$(mktemp)
          status=$(curl -sS -o "$existing_manifest" -w '%{http_code}' \
            --connect-timeout 5 --max-time 30 \
            https://data.phase-rs.dev/desktop/preview-server.json || true)
          case "$status" in
            200)
              jq -e 'type == "object" and (.fingerprints | type == "object")' "$existing_manifest" >/dev/null
              ;;
            404)
              printf '{}\n' > "$existing_manifest"
              ;;
            *)
              echo "::error::Could not fetch preview manifest for update (HTTP ${status:-curl failure})."
              exit 1
              ;;
          esac

          manifest=preview-server.json
          generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # data[].sha256 is over UNCOMPRESSED bytes: R2 serves those JSON files with Content-Encoding: br unconditionally, so consumers MUST brotli-decode before hashing. binaries[].sha256 is over the bytes as served — binaries are uploaded with no content encoding.
          jq -n \
            --slurpfile existing "$existing_manifest" \
            --arg fingerprint "$FINGERPRINT" \
            --arg commit "$COMMIT" \
            --arg generated_at "$generated_at" \
            --arg card_data_sha256 "$CARD_DATA_SHA256" \
            --arg card_data_url "$CARD_DATA_URL" \
            --arg draft_pools_sha256 "$DRAFT_POOLS_SHA256" \
            --arg draft_pools_url "$DRAFT_POOLS_URL" \
            --arg x86_64_unknown_linux_musl_sha256 "${sha256_of[x86_64-unknown-linux-musl]}" \
            --arg aarch64_unknown_linux_musl_sha256 "${sha256_of[aarch64-unknown-linux-musl]}" \
            --arg aarch64_apple_darwin_sha256 "${sha256_of[aarch64-apple-darwin]}" \
            --arg x86_64_pc_windows_msvc_sha256 "${sha256_of[x86_64-pc-windows-msvc]}" \
            '($existing[0] // {}) as $old
             | ($old.current // null) as $old_current
             | (if $old_current != null and ($old.fingerprints[$old_current] != null)
                then $old_current
                else null
                end) as $previous
             | {
                 schema: 1,
                 channel: "preview",
                 generated_at: $generated_at,
                 current: $fingerprint,
                 previous: $previous,
                 fingerprints: (
                   {
                     ($fingerprint): {
                       commit: $commit,
                       binaries: {
                         "x86_64-unknown-linux-musl": {
                           url: ("https://data.phase-rs.dev/desktop/preview-server/" + $fingerprint + "/phase-server-x86_64-unknown-linux-musl"),
                           sig_url: ("https://data.phase-rs.dev/desktop/preview-server/" + $fingerprint + "/phase-server-x86_64-unknown-linux-musl.minisig"),
                           sha256: $x86_64_unknown_linux_musl_sha256
                         },
                         "aarch64-unknown-linux-musl": {
                           url: ("https://data.phase-rs.dev/desktop/preview-server/" + $fingerprint + "/phase-server-aarch64-unknown-linux-musl"),
                           sig_url: ("https://data.phase-rs.dev/desktop/preview-server/" + $fingerprint + "/phase-server-aarch64-unknown-linux-musl.minisig"),
                           sha256: $aarch64_unknown_linux_musl_sha256
                         },
                         "aarch64-apple-darwin": {
                           url: ("https://data.phase-rs.dev/desktop/preview-server/" + $fingerprint + "/phase-server-aarch64-apple-darwin"),
                           sig_url: ("https://data.phase-rs.dev/desktop/preview-server/" + $fingerprint + "/phase-server-aarch64-apple-darwin.minisig"),
                           sha256: $aarch64_apple_darwin_sha256
                         },
                         "x86_64-pc-windows-msvc": {
                           url: ("https://data.phase-rs.dev/desktop/preview-server/" + $fingerprint + "/phase-server-x86_64-pc-windows-msvc.exe"),
                           sig_url: ("https://data.phase-rs.dev/desktop/preview-server/" + $fingerprint + "/phase-server-x86_64-pc-windows-msvc.exe.minisig"),
                           sha256: $x86_64_pc_windows_msvc_sha256
                         }
                       },
                       data: [
                         {
                           name: "card-data.json",
                           sha256: $card_data_sha256,
                           url: $card_data_url
                         },
                         {
                           name: "draft-pools.json",
                           sha256: $draft_pools_sha256,
                           url: $draft_pools_url
                         }
                       ]
                     }
                   }
                   + if $previous == null then {} else {($previous): $old.fingerprints[$previous]} end
                 )
               }' > "$manifest"

          # Read every binary back from the URL this manifest names and hold it
          # against the file that was uploaded. The URLs are taken from the
          # manifest rather than derived again here: a check with its own copy of
          # the path agrees with itself while the manifest names something else.
          # Nothing is published until this passes -- the manifest PUT is below.
          if ! diff <(for binary in "${binaries[@]}"; do platform_of "$binary"; done | sort) \
                    <(jq -r '.fingerprints[.current].binaries | keys[]' "$manifest" | sort); then
            echo "::error::The manifest's binary keys are not the set of binaries this job uploaded; a key with nothing beneath it 404s on the desktop."
            exit 1
          fi

          fetched=$(mktemp)
          verify_published() {
            local url=$1 expected=$2 actual
            # Retry discipline as release.yml's post-upload check(), bounded so
            # a hung CDN fails this step rather than the job timeout: --max-time
            # caps each attempt, --retry-max-time the retry loop, so one object
            # costs at most 180s. A fresh per-fingerprint key has no cached
            # predecessor to serve stale, and binaries upload with no content
            # encoding, so the bytes that arrive are the bytes to hash.
            if ! curl -sS --fail -o "$fetched" \
              --connect-timeout 5 --max-time 120 --retry 3 --retry-all-errors \
              --retry-max-time 60 "$url"; then
              echo "::error::Published preview object could not be read back: $url"
              exit 1
            fi
            actual=$(sha256sum "$fetched" | cut -d' ' -f1)
            if [ "$actual" != "$expected" ]; then
              echo "::error::$url is sha256 $actual, but the file uploaded for it is $expected"
              exit 1
            fi
          }

          for binary in "${binaries[@]}"; do
            platform=$(platform_of "$binary")
            entry=$(jq -er --arg platform "$platform" \
              '.fingerprints[.current].binaries[$platform]
               // error("manifest names no binary for \($platform)")
               | "\(.url)\t\(.sig_url)\t\(.sha256)"' "$manifest")
            IFS=$'\t' read -r url sig_url manifest_sha256 <<<"$entry"
            if [ "$manifest_sha256" != "${sha256_of[$platform]}" ]; then
              echo "::error::Manifest sha256 for $platform is $manifest_sha256, but the file uploaded for it is ${sha256_of[$platform]}"
              exit 1
            fi
            verify_published "$url" "$manifest_sha256"
            verify_published "$sig_url" "$(sha256sum "$binary.minisig" | cut -d' ' -f1)"
          done

          sign "$manifest"

          # Signature first; the JSON manifest PUT is the atomic publish point.
          npx wrangler r2 object put "phase-rs-data/desktop/preview-server.json.minisig" --file "$manifest.minisig" --remote --content-type application/octet-stream --cache-control "max-age=60, must-revalidate"
          npx wrangler r2 object put "phase-rs-data/desktop/preview-server.json" --file "$manifest" --remote --content-type application/json --cache-control "max-age=60, must-revalidate"

          # Wrangler supports individual object deletion but not prefix listing;
          # list through Cloudflare's R2 API, then delete each unreferenced key
          # with the same Wrangler/R2 credentials used for publication.
          list_prefix='desktop/preview-server/'
          api_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/phase-rs-data/objects"
          object_keys=$(mktemp)
          cursor=''
          while :; do
            curl_args=(
              --fail --silent --show-error --get "$api_url"
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
              --data-urlencode "prefix=$list_prefix"
              --data-urlencode 'per_page=1000'
            )
            if [ -n "$cursor" ]; then
              curl_args+=(--data-urlencode "cursor=$cursor")
            fi
            page=$(curl "${curl_args[@]}")
            jq -e '.success == true and (.result | type == "array")' <<<"$page" >/dev/null
            jq -r '.result[]?.key' <<<"$page" >> "$object_keys"
            if [ "$(jq -r '.result_info.is_truncated // false' <<<"$page")" != true ]; then
              break
            fi
            cursor=$(jq -r '.result_info.cursor // empty' <<<"$page")
            test -n "$cursor"
          done

          keep_prefixes=("$list_prefix$FINGERPRINT/")
          previous=$(jq -r '.previous // empty' "$manifest")
          if [ -n "$previous" ]; then
            keep_prefixes+=("$list_prefix$previous/")
          fi

          while IFS= read -r key; do
            keep=false
            for keep_prefix in "${keep_prefixes[@]}"; do
              if [[ "$key" == "$keep_prefix"* ]]; then
                keep=true
                break
              fi
            done
            if [ "$keep" = false ]; then
              echo "Deleting expired preview binary object: $key"
              npx wrangler r2 object delete "phase-rs-data/$key" --remote --force
            fi
          done < "$object_keys"
