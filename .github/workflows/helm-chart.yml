name: Helm chart

# Lint and render deploy/helm/phase-server. The chart has no CI coverage
# otherwise, and its failure mode is quiet: a template that renders invalid or
# empty YAML only shows up at `helm upgrade` time on someone's cluster.
#
# No secrets, no cluster: this only runs `helm lint` and `helm template`.

# `crates/phase-server/src/main.rs` is here because tests/assert-web-routing.sh
# reads the axum router out of it to derive the routes the chart must expose. A
# router-only change is exactly the case that assertion exists to catch, so
# without this path the check would not run when it matters most. The script
# asserts its own inputs are listed here, so the two cannot drift apart.
on:
  pull_request:
    paths:
      - 'deploy/helm/**'
      - 'crates/phase-server/src/main.rs'
      - '.github/workflows/helm-chart.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/helm/**'
      - 'crates/phase-server/src/main.rs'
      - '.github/workflows/helm-chart.yml'

permissions:
  contents: read

jobs:
  render:
    name: helm lint + template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned by commit SHA: a mutable tag can be force-pushed under us.
      # This job only reads the tree, so it needs no credentials left on disk.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.3

      - name: assert web routing
        # Renders what it needs itself: the SPA topology is several distinct
        # value combinations, and one leg reads the axum router to check that
        # every path the server mounts is still routed around the site's
        # catch-all. Placed before the render steps rather than after them so
        # that independence is structural — reordering or breaking them cannot
        # stop this assertion running.
        run: deploy/helm/phase-server/tests/assert-web-routing.sh

      - name: helm lint (default values)
        run: helm lint deploy/helm/phase-server

      - name: helm template (default values)
        run: |
          helm template phase-server deploy/helm/phase-server \
            --namespace phase > /tmp/default.yaml
          test -s /tmp/default.yaml

      # The opt-in paths render entirely different workloads (StatefulSet,
      # IngressRoutes, PrometheusRule, HPA), so a default-values render alone
      # would leave most of the chart untested.
      - name: helm template (scale-out + metrics + autoscaling)
        run: |
          cat > /tmp/scaleout.yaml <<'EOF'
          ingress:
            host: phase.example.com
            tls:
              clusterIssuer: letsencrypt
          scaleOut:
            enabled: true
            replicaMax: 3
          metrics:
            enabled: true
          autoscaling:
            enabled: true
          EOF
          helm lint deploy/helm/phase-server -f /tmp/scaleout.yaml
          # Every kind the chart gates on, not just the group: the templates
          # test `APIVersions.Has` per resource, and a real cluster's discovery
          # populates both forms. Passing only the group renders no monitors at
          # all, which the assertions below would let pass silently.
          # `serviceMonitor` is off by default, so it is enabled here to cover
          # the second gate.
          helm template phase-server deploy/helm/phase-server \
            --namespace phase -f /tmp/scaleout.yaml \
            --set metrics.serviceMonitor.enabled=true \
            --api-versions monitoring.coreos.com/v1 \
            --api-versions monitoring.coreos.com/v1/PrometheusRule \
            --api-versions monitoring.coreos.com/v1/PodMonitor \
            --api-versions monitoring.coreos.com/v1/ServiceMonitor > /tmp/scaleout-render.yaml
          test -s /tmp/scaleout-render.yaml
          grep -q 'kind: StatefulSet' /tmp/scaleout-render.yaml
          grep -q 'kind: HorizontalPodAutoscaler' /tmp/scaleout-render.yaml
          grep -q 'kind: PrometheusRule' /tmp/scaleout-render.yaml
          grep -q 'kind: PodMonitor' /tmp/scaleout-render.yaml
          grep -q 'kind: ServiceMonitor' /tmp/scaleout-render.yaml

      - name: assert compression boundary
        run: deploy/helm/phase-server/tests/assert-compression-boundary.sh /tmp/default.yaml /tmp/scaleout-render.yaml

      # With no prometheus-operator CRDs the operator path must FAIL rather than
      # render: hpa.yaml would otherwise install an HPA whose only producer of
      # `phase:wanted_replicas` — the PrometheusRule — was silently skipped.
      - name: helm template (scale-out, no operator CRDs) must fail
        run: |
          if helm template phase-server deploy/helm/phase-server \
               --namespace phase -f /tmp/scaleout.yaml > /tmp/no-crd.yaml 2>/tmp/no-crd.err; then
            echo "expected the render to fail without monitoring.coreos.com/v1"; exit 1
          fi
          # Match the capability the guard names, not its prose: the message
          # has already been reworded once, and this assertion silently stopped
          # matching it.
          grep -q 'monitoring.coreos.com/v1/PrometheusRule' /tmp/no-crd.err

      # The escape hatch stays open: with prometheusRule.enabled=false the operator
      # is not required at all, because the recording rule is supplied externally
      # (prometheus-adapter externalRules). That must still render on a bare cluster.
      - name: helm template (scale-out, external recording rule, no CRDs)
        run: |
          helm template phase-server deploy/helm/phase-server \
            --namespace phase -f /tmp/scaleout.yaml \
            --set autoscaling.prometheusRule.enabled=false > /tmp/no-crd.yaml
          test -s /tmp/no-crd.yaml
          grep -q 'kind: StatefulSet' /tmp/no-crd.yaml
          grep -q 'kind: HorizontalPodAutoscaler' /tmp/no-crd.yaml
          if grep -q 'kind: PodMonitor' /tmp/no-crd.yaml; then echo "unexpected 'kind: PodMonitor' in /tmp/no-crd.yaml"; exit 1; fi
          if grep -q 'kind: PrometheusRule' /tmp/no-crd.yaml; then echo "unexpected 'kind: PrometheusRule' in /tmp/no-crd.yaml"; exit 1; fi

      # Guards the chart's central safety property: the default path must stay a
      # single-replica Deployment, and scale-out must give every ordinal its own
      # claim. Two processes on one games.db is destructive.
      - name: assert the storage invariants
        run: |
          # The kind, not just the count: `replicas: 1` alone would still pass
          # if the default path became a single-replica StatefulSet, which is
          # the shape this invariant exists to keep it out of.
          grep -q 'kind: Deployment' /tmp/default.yaml
          grep -q 'replicas: 1' /tmp/default.yaml
          grep -q 'volumeClaimTemplates' /tmp/scaleout-render.yaml
          if grep -q 'kind: Deployment' /tmp/scaleout-render.yaml; then echo "unexpected 'kind: Deployment' in /tmp/scaleout-render.yaml"; exit 1; fi

      # `logging.enabled` defaults to false (values.yaml), so the default
      # render must carry none of the logging surface — a regression in any
      # of the `if .Values.logging.enabled` gates would otherwise ship an
      # opt-in component on by default with every check above staying green.
      - name: assert logging is absent by default
        run: |
          if grep -q 'kind: ConfigMap' /tmp/default.yaml; then echo "unexpected 'kind: ConfigMap' in /tmp/default.yaml"; exit 1; fi
          if grep -q 'PHASE_LOG_DIR' /tmp/default.yaml; then echo "unexpected 'PHASE_LOG_DIR' in /tmp/default.yaml"; exit 1; fi
          if grep -q 'nginxinc/nginx-unprivileged' /tmp/default.yaml; then echo "unexpected 'nginxinc/nginx-unprivileged' in /tmp/default.yaml"; exit 1; fi
          if grep -q 'targetPort: logs' /tmp/default.yaml; then echo "unexpected 'targetPort: logs' in /tmp/default.yaml"; exit 1; fi

      # The read-only logs sidecar (PHASE_LOG_DIR, its ConfigMap, and the
      # `logs` Service port) is entirely gated on `logging.enabled`, so none
      # of the renders above ever touch it — assert it explicitly, in both
      # the default and scale-out shapes.
      - name: helm template (logging enabled)
        run: |
          # The security-relevant mount is the *combination* of subPath and
          # read-only, not either alone: a generic `readOnly` grep can match
          # an unrelated mount (the ConfigMap's is read-only too) and would
          # stay green even if `readOnly: true` were dropped from this one,
          # granting the sidecar write access to the logs subtree. Match the
          # exact contiguous block instead of two independent greps.
          data_mount_ro='- name: data\n\s+mountPath: /var/lib/phase-server/logs\n\s+subPath: logs\n\s+readOnly: true'

          helm template phase-server deploy/helm/phase-server \
            --namespace phase --set logging.enabled=true > /tmp/logging-default.yaml
          grep -q 'kind: ConfigMap' /tmp/logging-default.yaml
          grep -q 'name: PHASE_LOG_DIR' /tmp/logging-default.yaml
          grep -q 'nginxinc/nginx-unprivileged' /tmp/logging-default.yaml
          grep -Pzoq -- "$data_mount_ro" /tmp/logging-default.yaml
          # Only the entry Service in the default (non-scale-out) shape.
          test "$(grep -c 'targetPort: logs' /tmp/logging-default.yaml)" -eq 1
          # Operator-only must not depend on networkPolicy.enabled: the sidecar
          # binds loopback-only regardless, so the Service/pod-IP path is dead
          # even if NetworkPolicy is off or the CNI doesn't enforce it.
          grep -q 'listen 127.0.0.1:' /tmp/logging-default.yaml
          # No freshness policy otherwise, so a cached file or autoindex
          # response could persist across port-forward targets.
          grep -q 'add_header Cache-Control no-store always;' /tmp/logging-default.yaml

          helm template phase-server deploy/helm/phase-server \
            --namespace phase -f /tmp/scaleout.yaml --set logging.enabled=true \
            --api-versions monitoring.coreos.com/v1 \
            --api-versions monitoring.coreos.com/v1/PrometheusRule \
            --api-versions monitoring.coreos.com/v1/PodMonitor \
            --api-versions monitoring.coreos.com/v1/ServiceMonitor > /tmp/logging-scaleout.yaml
          grep -q 'kind: ConfigMap' /tmp/logging-scaleout.yaml
          grep -q 'name: PHASE_LOG_DIR' /tmp/logging-scaleout.yaml
          grep -q 'nginxinc/nginx-unprivileged' /tmp/logging-scaleout.yaml
          grep -Pzoq -- "$data_mount_ro" /tmp/logging-scaleout.yaml
          # Entry + headless + one per ordinal, at scaleOut.replicaMax 3 above.
          test "$(grep -c 'targetPort: logs' /tmp/logging-scaleout.yaml)" -eq 5
          grep -q 'listen 127.0.0.1:' /tmp/logging-scaleout.yaml
          grep -q 'add_header Cache-Control no-store always;' /tmp/logging-scaleout.yaml

      # Pins the chosen invariant for the reported unsafe combination: with
      # NetworkPolicy off, nothing in the chart restricts ingress by policy,
      # so the sidecar's own loopback-only bind must be the thing that keeps
      # it operator-only. Rendered with the ingress/scale-out values too, so
      # the Service actually carries `targetPort: logs` while this holds.
      - name: helm template (logging enabled, networkPolicy disabled) stays loopback-only
        run: |
          helm template phase-server deploy/helm/phase-server \
            --namespace phase -f /tmp/scaleout.yaml \
            --set logging.enabled=true --set networkPolicy.enabled=false \
            --api-versions monitoring.coreos.com/v1 \
            --api-versions monitoring.coreos.com/v1/PrometheusRule \
            --api-versions monitoring.coreos.com/v1/PodMonitor \
            --api-versions monitoring.coreos.com/v1/ServiceMonitor > /tmp/logging-no-netpol.yaml
          if grep -q 'kind: NetworkPolicy' /tmp/logging-no-netpol.yaml; then echo "unexpected 'kind: NetworkPolicy' in /tmp/logging-no-netpol.yaml"; exit 1; fi
          grep -q 'targetPort: logs' /tmp/logging-no-netpol.yaml
          grep -q 'listen 127.0.0.1:' /tmp/logging-no-netpol.yaml

      # Regression pin: a `logging.dir` that string-prefix-matches
      # PHASE_DATA_DIR but trims to an empty (or `..`-containing) subPath
      # would mount the *entire* data PVC — games.db and its WAL included —
      # read-only into the autoindexed sidecar, not just the logs subtree.
      # Both must-fail cases are paired with the must-succeed render above,
      # so the guard is proven to track the value, not to refuse the
      # feature outright.
      - name: helm template (logging enabled, unsafe logging.dir) must fail
        run: |
          if helm template phase-server deploy/helm/phase-server \
               --namespace phase --set logging.enabled=true \
               --set logging.dir=/var/lib/phase-server/ \
               > /tmp/logging-root.yaml 2>/tmp/logging-root.err; then
            echo "expected the render to fail for logging.dir at the PVC root"; exit 1
          fi
          grep -q 'traversal-free descendant' /tmp/logging-root.err

          if helm template phase-server deploy/helm/phase-server \
               --namespace phase --set logging.enabled=true \
               --set logging.dir=/var/lib/phase-server/logs/../../etc \
               > /tmp/logging-traversal.yaml 2>/tmp/logging-traversal.err; then
            echo "expected the render to fail for a logging.dir containing '..'"; exit 1
          fi
          grep -q 'traversal-free descendant' /tmp/logging-traversal.err

          # A trailing `.` string-prefix-matches PHASE_DATA_DIR just like the
          # empty-subPath case above, and kubelet's subPath join treats a
          # bare `.` segment as the volume root too -- reproducing the same
          # exposure under a different disguise.
          if helm template phase-server deploy/helm/phase-server \
               --namespace phase --set logging.enabled=true \
               --set logging.dir=/var/lib/phase-server/. \
               > /tmp/logging-dot.yaml 2>/tmp/logging-dot.err; then
            echo "expected the render to fail for logging.dir=/var/lib/phase-server/."; exit 1
          fi
          grep -q 'traversal-free descendant' /tmp/logging-dot.err

      # `scaleOut.scheme` names the URL each ordinal advertises, and the client
      # turns that string into the "CODE@host" share link a friend dials. Every
      # IngressRoute the chart renders terminates TLS, so `http` is refused
      # while the chart owns the edge — and stays legal when it does not.
      - name: helm template (scale-out, advertised scheme)
        run: |
          if helm template phase-server deploy/helm/phase-server \
               --namespace phase -f /tmp/scaleout.yaml \
               --set scaleOut.scheme=http \
               --api-versions monitoring.coreos.com/v1 \
               --api-versions monitoring.coreos.com/v1/PrometheusRule \
               --api-versions monitoring.coreos.com/v1/PodMonitor \
               --api-versions monitoring.coreos.com/v1/ServiceMonitor \
               > /tmp/scheme-http.yaml 2>/tmp/scheme-http.err; then
            echo "expected http to be refused while the chart renders TLS routes"; exit 1
          fi
          grep -q 'scaleOut.scheme' /tmp/scheme-http.err

          # Control: the guard has to fire on the contradiction, not on the
          # knob. Without this the case above would pass on a chart that
          # rejected every scheme.
          helm template phase-server deploy/helm/phase-server \
            --namespace phase -f /tmp/scaleout.yaml \
            --set scaleOut.scheme=https \
            --api-versions monitoring.coreos.com/v1 \
            --api-versions monitoring.coreos.com/v1/PrometheusRule \
            --api-versions monitoring.coreos.com/v1/PodMonitor \
            --api-versions monitoring.coreos.com/v1/ServiceMonitor > /tmp/scheme-https.yaml
          # One entry route plus one per ordinal, at scaleOut.replicaMax 3 above.
          routes=$(grep -c 'kind: IngressRoute' /tmp/scheme-https.yaml)
          test "$routes" -eq 4

          # No chart-managed route means the operator owns the edge, so the
          # advertised scheme is theirs to choose.
          helm template phase-server deploy/helm/phase-server \
            --namespace phase -f /tmp/scaleout.yaml \
            --set scaleOut.scheme=http --set ingress.enabled=false \
            --api-versions monitoring.coreos.com/v1 \
            --api-versions monitoring.coreos.com/v1/PrometheusRule \
            --api-versions monitoring.coreos.com/v1/PodMonitor \
            --api-versions monitoring.coreos.com/v1/ServiceMonitor > /tmp/scheme-noingress.yaml
          if grep -q 'kind: IngressRoute' /tmp/scheme-noingress.yaml; then echo "unexpected 'kind: IngressRoute' in /tmp/scheme-noingress.yaml"; exit 1; fi
          grep -q 'value: "http://phase-"' /tmp/scheme-noingress.yaml

      # The HPA reads `phase:wanted_replicas`, the PrometheusRule produces it,
      # and the rule reads gauges only a PodMonitor or ServiceMonitor scrapes.
      # A partial operator install can register the rule's CRD and neither
      # monitor's, so the chart must refuse rather than ship an HPA that can
      # never get its metric.
      - name: helm template (autoscaling without a monitor CRD) must fail
        run: |
          if helm template phase-server deploy/helm/phase-server \
               --namespace phase -f /tmp/scaleout.yaml \
               --api-versions monitoring.coreos.com/v1 \
               --api-versions monitoring.coreos.com/v1/PrometheusRule \
               > /tmp/no-monitor.yaml 2>/tmp/no-monitor.err; then
            echo "expected the render to fail with no PodMonitor or ServiceMonitor CRD"; exit 1
          fi
          grep -q 'monitor that will actually render' /tmp/no-monitor.err

          # Control: adding only the PodMonitor kind clears it, so the guard
          # tracks the missing CRD rather than refusing autoscaling outright.
          helm template phase-server deploy/helm/phase-server \
            --namespace phase -f /tmp/scaleout.yaml \
            --api-versions monitoring.coreos.com/v1 \
            --api-versions monitoring.coreos.com/v1/PrometheusRule \
            --api-versions monitoring.coreos.com/v1/PodMonitor > /tmp/with-monitor.yaml
          grep -q 'kind: PodMonitor' /tmp/with-monitor.yaml
          grep -q 'kind: PrometheusRule' /tmp/with-monitor.yaml
          grep -q 'kind: HorizontalPodAutoscaler' /tmp/with-monitor.yaml
