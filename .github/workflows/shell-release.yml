name: Shell Release

on:
  push:
    tags: ["shell-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Shell release tag to recover, e.g. shell-v1.0.0
        required: true
        type: string

permissions: {}

concurrency:
  group: shell-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-shell-ref:
    name: Resolve Shell Release Ref
    if: github.repository == 'phase-rs/phase'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
      shell_version: ${{ steps.resolve.outputs.shell_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and commit
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$PUSH_TAG"
          fi

          if ! [[ "$TAG" =~ ^shell-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::shell release tag must be like shell-v1.0.0"
            exit 1
          fi

          git fetch --force --tags origin "refs/tags/$TAG:refs/tags/$TAG"
          SHA=$(git rev-list -n 1 "$TAG")

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "shell_version=${TAG#shell-v}" >> "$GITHUB_OUTPUT"

  shell-preflight:
    name: Shell Preflight
    needs: [resolve-shell-ref]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.resolve-shell-ref.outputs.release_sha }}
      SHELL_VERSION: ${{ needs.resolve-shell-ref.outputs.shell_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Stamp shell version
        run: |
          python3 - "$SHELL_VERSION" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          config_path = Path("client/src-tauri/tauri.conf.json")
          config = json.loads(config_path.read_text())
          config["version"] = version
          config_path.write_text(json.dumps(config, indent=2) + "\n")

          cargo_path = Path("client/src-tauri/Cargo.toml")
          cargo = cargo_path.read_text()
          cargo, replacements = re.subn(
              r'^version = "[^"]+"$', f'version = "{version}"', cargo, count=1,
              flags=re.MULTILINE,
          )
          if replacements != 1:
              raise SystemExit("expected exactly one phase-tauri package version")
          cargo_path.write_text(cargo)

          # Cargo.lock records phase-tauri's own version; without this the
          # stamped manifest fails `cargo check --locked`.
          lock_path = Path("client/src-tauri/Cargo.lock")
          lock = lock_path.read_text()
          lock, replacements = re.subn(
              r'(\[\[package\]\]\nname = "phase-tauri"\nversion = ")[^"]+(")',
              rf'\g<1>{version}\g<2>', lock, count=1,
          )
          if replacements != 1:
              raise SystemExit("expected exactly one phase-tauri lockfile entry")
          lock_path.write_text(lock)
          PY

      - name: Assert shell version stamping
        run: |
          set -euo pipefail
          test "$(jq -r '.version' client/src-tauri/tauri.conf.json)" = "$SHELL_VERSION"
          test "$(sed -nE 's/^version = "([^"]+)"/\1/p' client/src-tauri/Cargo.toml | head -1)" = "$SHELL_VERSION"
          test "$(awk '/^name = "phase-tauri"$/ { getline; sub(/^version = "/, ""); sub(/"$/, ""); print }' client/src-tauri/Cargo.lock)" = "$SHELL_VERSION"

      - name: Validate Tauri JSON configs
        run: |
          set -euo pipefail
          jq empty client/src-tauri/tauri.conf.json
          for f in client/src-tauri/capabilities/*.json; do
            jq empty "$f"
          done

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: rust-shell-preflight

      - name: Install Linux Tauri build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Stub bootstrap dist for tauri::generate_context!
        # phase-tauri's build script validates frontendDist. The shell's real
        # bootstrap is not needed for a Rust-only compile check.
        run: |
          mkdir -p client/bootstrap/dist
          echo '<!doctype html><html></html>' > client/bootstrap/dist/index.html

      - name: cargo check phase-tauri
        # phase-tauri is excluded from the root workspace, so this must run
        # against its standalone manifest after version stamping.
        run: cargo check --locked --manifest-path client/src-tauri/Cargo.toml

  build-shell:
    name: Build Shell (${{ matrix.os }})
    needs: [resolve-shell-ref, shell-preflight]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.resolve-shell-ref.outputs.release_sha }}
      SHELL_VERSION: ${{ needs.resolve-shell-ref.outputs.shell_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            artifact: shell-tauri-linux
          - os: macos
            runner: macos-latest
            artifact: shell-tauri-macos
          - os: windows
            runner: windows-latest
            artifact: shell-tauri-windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: rust-shell-${{ matrix.os }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Stamp shell version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const version = process.env.SHELL_VERSION;
          const configPath = "client/src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
          config.version = version;
          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);

          const cargoPath = "client/src-tauri/Cargo.toml";
          const cargo = fs.readFileSync(cargoPath, "utf8");
          const cargoPattern = /^version = "[^"]+"$/m;
          if (!cargoPattern.test(cargo)) {
            throw new Error("expected a phase-tauri package version to stamp");
          }
          fs.writeFileSync(cargoPath, cargo.replace(cargoPattern, `version = "${version}"`));

          // Cargo.lock records phase-tauri's own version; keep it in sync so
          // the build never resolves against a stale locked version.
          const lockPath = "client/src-tauri/Cargo.lock";
          const lock = fs.readFileSync(lockPath, "utf8");
          const lockPattern = /(\[\[package\]\]\nname = "phase-tauri"\nversion = ")[^"]+(")/;
          if (!lockPattern.test(lock)) {
            throw new Error("expected a phase-tauri lockfile entry to stamp");
          }
          fs.writeFileSync(lockPath, lock.replace(lockPattern, `$1${version}$2`));
          NODE

      - name: Assert shell version stamping
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./client/src-tauri/tauri.conf.json').version")" = "$SHELL_VERSION"
          test "$(sed -nE 's/^version = "([^"]+)"/\1/p' client/src-tauri/Cargo.toml | head -1)" = "$SHELL_VERSION"
          test "$(awk '/^name = "phase-tauri"$/ { getline; sub(/^version = "/, ""); sub(/"$/, ""); print }' client/src-tauri/Cargo.lock)" = "$SHELL_VERSION"

      - name: Install system dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install bootstrap dependencies
        run: cd client && pnpm install --frozen-lockfile

      # Tauri selects its macOS signing path by the presence of these vars. Export
      # only non-empty secrets so an unavailable certificate keeps the ad-hoc path.
      - name: Configure macOS signing
        if: matrix.os == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No APPLE_CERTIFICATE secret; ad-hoc self-signing the macOS bundle."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "APPLE_CERTIFICATE found; signing with the Developer ID certificate."
          {
            echo "APPLE_CERTIFICATE<<__EOF__"
            echo "$APPLE_CERTIFICATE"
            echo "__EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
          } >> "$GITHUB_ENV"

          for var in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!var:-}" ]; then
              echo "$var=${!var}" >> "$GITHUB_ENV"
            fi
          done

      - name: Build shell
        uses: tauri-apps/tauri-action@v0
        env:
          # beforeBuildCommand runs only pnpm build:bootstrap. SHELL_REMOTE_ORIGIN
          # is intentionally unset so release shells use https://phase-rs.dev.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client

      - name: Stage shell artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          find client/src-tauri/target/release/bundle \
            -maxdepth 2 \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.AppImage.sig' \
               -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
               -o -name '*.exe' -o -name '*.exe.sig' \) \
            -exec cp {} staging/ \;

          rename_artifact() {
            local pattern="$1"
            local destination="$2"
            local source
            source=$(find staging -maxdepth 1 -type f -name "$pattern" -print -quit)
            [ -n "$source" ] || return 0
            mv "$source" "staging/$destination"
            if [ -f "$source.sig" ]; then
              mv "$source.sig" "staging/$destination.sig"
            fi
          }

          rename_artifact '*-setup.exe' 'Phase-Desktop-Windows-x64-Setup.exe'
          rename_artifact '*.dmg' 'Phase-Desktop-macOS-Apple-Silicon.dmg'
          rename_artifact '*.app.tar.gz' 'Phase-Desktop-macOS-Apple-Silicon.app.tar.gz'
          rename_artifact '*.AppImage' 'Phase-Desktop-Linux-x86_64.AppImage'
          rename_artifact '*.deb' 'Phase-Desktop-Linux-x86_64.deb'
          ls -la staging/

      - name: Upload shell artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staging/*
          retention-days: 90

  build-android:
    name: Build Signed Android APKs
    needs: [resolve-shell-ref, shell-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      apk_available: ${{ steps.android-artifacts.outputs.available }}
    env:
      RELEASE_SHA: ${{ needs.resolve-shell-ref.outputs.release_sha }}
      SHELL_VERSION: ${{ needs.resolve-shell-ref.outputs.shell_version }}
    steps:
      - name: Detect Android signing configuration
        id: android-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERTIFICATE_SHA256: ${{ secrets.ANDROID_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          present=0
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_CERTIFICATE_SHA256; do
            if [ -n "${!variable}" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -eq 0 ]; then
            echo '::notice::Android signing is not configured; desktop release will continue without APKs'
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$present" -ne 5 ]; then
            echo '::error::Android signing is partially configured; provide all five Android secrets or none'
            exit 1
          fi
          echo 'available=true' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.android-signing.outputs.available == 'true'
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Validate Gradle wrapper
        if: steps.android-signing.outputs.available == 'true'
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.android-signing.outputs.available == 'true'
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.android-signing.outputs.available == 'true'
        with:
          node-version: 22

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.android-signing.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        if: steps.android-signing.outputs.available == 'true'

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        if: steps.android-signing.outputs.available == 'true'
        with:
          target: aarch64-linux-android,armv7-linux-androideabi
          cache: false

      - name: Install pinned Android SDK and NDK
        if: steps.android-signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Stamp shell version
        if: steps.android-signing.outputs.available == 'true'
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const version = process.env.SHELL_VERSION;
          const configPath = "client/src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
          config.version = version;
          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);

          const cargoPath = "client/src-tauri/Cargo.toml";
          const cargo = fs.readFileSync(cargoPath, "utf8");
          const cargoPattern = /^version = "[^"]+"$/m;
          if (!cargoPattern.test(cargo)) throw new Error("expected phase-tauri package version");
          fs.writeFileSync(cargoPath, cargo.replace(cargoPattern, `version = "${version}"`));

          const lockPath = "client/src-tauri/Cargo.lock";
          const lock = fs.readFileSync(lockPath, "utf8");
          const lockPattern = /(\[\[package\]\]\nname = "phase-tauri"\nversion = ")[^"]+(")/;
          if (!lockPattern.test(lock)) throw new Error("expected phase-tauri lockfile entry");
          fs.writeFileSync(lockPath, lock.replace(lockPattern, `$1${version}$2`));
          NODE

      - name: Configure fail-closed Android signing
        if: steps.android-signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PHASE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PHASE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PHASE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in ANDROID_KEYSTORE_BASE64 PHASE_ANDROID_KEYSTORE_PASSWORD PHASE_ANDROID_KEY_ALIAS PHASE_ANDROID_KEY_PASSWORD; do
            test -n "${!variable:-}" || { echo "::error::Missing required Android signing secret: $variable"; exit 1; }
          done
          KEYSTORE_FILE="$RUNNER_TEMP/phase-android-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

      - name: Install frozen client dependencies
        if: steps.android-signing.outputs.available == 'true'
        run: cd client && pnpm install --frozen-lockfile

      - name: Build signed ARM64 and ARMv7 APKs through the project CLI
        if: steps.android-signing.outputs.available == 'true'
        env:
          PHASE_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/phase-android-release.jks
          PHASE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PHASE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PHASE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          NODE_BIN=$(realpath "$(command -v node)")
          TAURI_JS="$GITHUB_WORKSPACE/client/node_modules/@tauri-apps/cli/tauri.js"
          test -f "$NODE_BIN"
          test -x "$NODE_BIN"
          test -f "$TAURI_JS"
          export ORG_GRADLE_PROJECT_phaseNodeExecutable="$NODE_BIN"
          "$NODE_BIN" "$TAURI_JS" android build --target aarch64 armv7 --split-per-abi --apk

      - name: Inspect and stage signed Android APKs
        if: steps.android-signing.outputs.available == 'true'
        env:
          ANDROID_CERTIFICATE_SHA256: ${{ secrets.ANDROID_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          mkdir -p staging
          ARM64_APK=''
          ARMV7_APK=''
          for apk in $(find client/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print); do
            mapfile -t ABIS < <(unzip -Z1 "$apk" | sed -nE 's#^lib/([^/]+)/.*\.so$#\1#p' | sort -u)
            test "${#ABIS[@]}" -eq 1
            case "${ABIS[0]}" in
              arm64-v8a) ARM64_APK="$apk" ;;
              armeabi-v7a) ARMV7_APK="$apk" ;;
              *) echo "Unexpected release APK ABI: ${ABIS[0]}"; exit 1 ;;
            esac
          done
          test -n "$ARM64_APK"
          test -n "$ARMV7_APK"

          TAURI_PROPERTIES='client/src-tauri/gen/android/app/tauri.properties'
          test -f "$TAURI_PROPERTIES"
          TAURI_VERSION_NAME=$(sed -n 's/^tauri.android.versionName=//p' "$TAURI_PROPERTIES")
          TAURI_VERSION_CODE=$(sed -n 's/^tauri.android.versionCode=//p' "$TAURI_PROPERTIES")
          test "$TAURI_VERSION_NAME" = "$SHELL_VERSION"
          [[ "$TAURI_VERSION_CODE" =~ ^[0-9]+$ ]]

          expected_digest=$(printf '%s' "${ANDROID_CERTIFICATE_SHA256:-}" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          if ! [[ "$expected_digest" =~ ^[0-9A-F]{64}$ ]]; then
            echo '::error::ANDROID_CERTIFICATE_SHA256 must be the protected release certificate SHA-256 digest'
            exit 1
          fi
          signer_digest=''
          for apk in "$ARM64_APK" "$ARMV7_APK"; do
            BADGING=$($AAPT2 dump badging "$apk")
            grep -F "package: name='rs.phase.app' versionCode='$TAURI_VERSION_CODE' versionName='$SHELL_VERSION'" <<<"$BADGING"
            grep -F "minSdkVersion:'24'" <<<"$BADGING"
            grep -F "targetSdkVersion:'36'" <<<"$BADGING"
            SIGNING=$($APKSIGNER verify --verbose --print-certs "$apk")
            grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' <<<"$SIGNING"
            if grep -Fq 'CN=Android Debug' <<<"$SIGNING"; then
              echo "::error::Release APK is debug-signed: $apk"
              exit 1
            fi
            digest=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<<"$SIGNING" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
            test "$digest" = "$expected_digest"
            if [ -z "$signer_digest" ]; then signer_digest="$digest"; else test "$digest" = "$signer_digest"; fi
            if unzip -Z1 "$apk" | grep -Eq '(^|/)(update\.json|.*\.sig)$'; then
              echo 'Android release APK unexpectedly contains updater material'
              exit 1
            fi
          done
          cp "$ARM64_APK" staging/Phase-Android-ARM64.apk
          cp "$ARMV7_APK" staging/Phase-Android-ARMv7.apk

      - name: Upload signed Android artifacts
        id: upload-android-artifacts
        if: steps.android-signing.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shell-tauri-android
          path: staging/*.apk
          retention-days: 90

      - name: Record signed Android artifact availability
        id: android-artifacts
        if: always()
        env:
          SIGNING_AVAILABLE: ${{ steps.android-signing.outputs.available }}
          UPLOAD_OUTCOME: ${{ steps.upload-android-artifacts.outcome }}
        run: |
          if [ "$SIGNING_AVAILABLE" = 'true' ] && [ "$UPLOAD_OUTCOME" = 'success' ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

  release-shell:
    name: Create Shell Release
    needs: [resolve-shell-ref, build-shell, build-android]
    if: ${{ always() && needs.resolve-shell-ref.result == 'success' && needs.build-shell.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SHELL_TAG: ${{ needs.resolve-shell-ref.outputs.release_tag }}
      SHELL_VERSION: ${{ needs.resolve-shell-ref.outputs.shell_version }}
    steps:
      - name: Download Linux shell artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shell-tauri-linux
          path: artifacts/shell-tauri-linux

      - name: Download macOS shell artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shell-tauri-macos
          path: artifacts/shell-tauri-macos

      - name: Download Windows shell artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shell-tauri-windows
          path: artifacts/shell-tauri-windows

      - name: Generate updater manifest
        run: |
          set -euo pipefail

          TAG="$SHELL_TAG"
          REPO="${GITHUB_REPOSITORY}"
          shopt -s nullglob

          first_match() {
            local pattern="$1"
            local match
            match=$(compgen -G "$pattern" | sort | head -1 || true)
            printf '%s' "$match"
          }

          artifact_url() {
            local path="$1"
            local name
            name=$(basename "$path")
            printf 'https://github.com/%s/releases/download/%s/%s' \
              "$REPO" "$TAG" "$(jq -rn --arg value "$name" '$value | @uri')"
          }

          LINUX_PAYLOAD=$(first_match "artifacts/shell-tauri-linux/Phase-Desktop-Linux-x86_64.AppImage")
          MACOS_PAYLOAD=$(first_match "artifacts/shell-tauri-macos/Phase-Desktop-macOS-Apple-Silicon.app.tar.gz")
          WINDOWS_PAYLOAD=$(first_match "artifacts/shell-tauri-windows/Phase-Desktop-Windows-x64-Setup.exe")
          LINUX_SIG=""
          MACOS_SIG=""
          WINDOWS_SIG=""
          if [ -n "$LINUX_PAYLOAD" ] && [ -f "$LINUX_PAYLOAD.sig" ]; then LINUX_SIG=$(cat "$LINUX_PAYLOAD.sig"); fi
          if [ -n "$MACOS_PAYLOAD" ] && [ -f "$MACOS_PAYLOAD.sig" ]; then MACOS_SIG=$(cat "$MACOS_PAYLOAD.sig"); fi
          if [ -n "$WINDOWS_PAYLOAD" ] && [ -f "$WINDOWS_PAYLOAD.sig" ]; then WINDOWS_SIG=$(cat "$WINDOWS_PAYLOAD.sig"); fi

          missing=0
          if [ -z "$LINUX_PAYLOAD" ] || [ -z "$LINUX_SIG" ]; then echo "::error::Missing Linux updater payload/signature"; missing=1; fi
          if [ -z "$MACOS_PAYLOAD" ] || [ -z "$MACOS_SIG" ]; then echo "::error::Missing macOS updater payload/signature"; missing=1; fi
          if [ -z "$WINDOWS_PAYLOAD" ] || [ -z "$WINDOWS_SIG" ]; then echo "::error::Missing Windows updater payload/signature"; missing=1; fi
          [ "$missing" = "0" ]

          PLATFORMS="{"
          LINUX_URL=$(artifact_url "$LINUX_PAYLOAD")
          PLATFORMS="${PLATFORMS}\"linux-x86_64\":{\"signature\":\"${LINUX_SIG}\",\"url\":\"${LINUX_URL}\"}"
          MACOS_URL=$(artifact_url "$MACOS_PAYLOAD")
          PLATFORMS="${PLATFORMS},\"darwin-aarch64\":{\"signature\":\"${MACOS_SIG}\",\"url\":\"${MACOS_URL}\"}"
          WINDOWS_URL=$(artifact_url "$WINDOWS_PAYLOAD")
          PLATFORMS="${PLATFORMS},\"windows-x86_64\":{\"signature\":\"${WINDOWS_SIG}\",\"url\":\"${WINDOWS_URL}\"}}"

          echo "{\"version\":\"${SHELL_VERSION}\",\"notes\":\"Shell release ${TAG}\",\"pub_date\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"platforms\":${PLATFORMS}}" \
            | jq . > artifacts/update.json
          test -s artifacts/update.json
          test "$(jq -r '.platforms | keys | sort | join(",")' artifacts/update.json)" = 'darwin-aarch64,linux-x86_64,windows-x86_64'
          ! grep -qi 'android' artifacts/update.json

      - name: Create shell release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.SHELL_TAG }}
          name: phase.rs Desktop v${{ env.SHELL_VERSION }}
          # The installer is the only thing a human comes to /releases for, so
          # it holds the "Latest" badge; web releases opt out (release.yml).
          make_latest: "true"
          body: |
            ## Install phase.rs Desktop

            Download the installer for your platform:

            - **Windows:** `Phase-Desktop-Windows-x64-Setup.exe`
            - **macOS (Apple Silicon):** `Phase-Desktop-macOS-Apple-Silicon.dmg`
            - **Linux:** `Phase-Desktop-Linux-x86_64.deb` or `Phase-Desktop-Linux-x86_64.AppImage`
            - **Android:** ARM64 and ARMv7 APKs are attached when release signing is configured.

            This is the official desktop app for [phase-rs.dev](https://phase-rs.dev).
            `update.json` is used by automatic updates; it is not a manual download.
          fail_on_unmatched_files: true
          files: |
            artifacts/shell-tauri-linux/Phase-Desktop-Linux-x86_64.deb
            artifacts/shell-tauri-linux/Phase-Desktop-Linux-x86_64.AppImage
            artifacts/shell-tauri-macos/Phase-Desktop-macOS-Apple-Silicon.dmg
            artifacts/shell-tauri-macos/Phase-Desktop-macOS-Apple-Silicon.app.tar.gz
            artifacts/shell-tauri-windows/Phase-Desktop-Windows-x64-Setup.exe
            artifacts/update.json

      - name: Download signed Android APKs
        if: needs.build-android.outputs.apk_available == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shell-tauri-android
          path: artifacts/shell-tauri-android

      - name: Attach signed Android APKs
        if: needs.build-android.outputs.apk_available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$SHELL_TAG" \
            artifacts/shell-tauri-android/Phase-Android-ARM64.apk \
            artifacts/shell-tauri-android/Phase-Android-ARMv7.apk \
            --clobber
