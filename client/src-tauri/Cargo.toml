[package]
name = "phase-tauri"
version = "0.1.54"
edition = "2021"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
engine = { path = "../../crates/engine" }
phase-ai = { path = "../../crates/phase-ai" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
# Pin: time 0.3.47's HourBase modifier triggers E0119 coherence conflicts with
# tauri-utils' blanket `impl<T: Into<Number>> From<T> for Value`. Remove once
# tauri-utils or time resolves the overlap (phase-tauri has no workspace lockfile).
time = "=0.3.46"
