# Default nginx.conf of the phase-web image (deploy/phase-web.Dockerfile), so
# the image serves the client on its own:
#
#   docker run -p 8080:8080 \
#     -e PHASE_MULTIPLAYER_SERVER_URL=wss://phase.example.com/ws <image>
#
# A copy of the phase-server chart's (templates/web-configmap.yaml) rendered with
# web.server.port=8080, the port nginx-unprivileged exposes, except that
# /config.js comes from 40-phase-web-config.sh instead of a mounted ConfigMap.
# The chart keeps mounting its own over this file. Change the two together:
# deploy/helm/phase-server/tests/assert-web-image-defaults.sh fails on any other
# difference.
worker_processes 1;
pid /tmp/nginx.pid;
events {
  worker_connections 256;
}
http {
  # The logs sidecar omits this because autoindexed text does not care.
  # Without it every asset is served as text/plain: index.html renders as
  # source, `type="module"` scripts are refused on MIME grounds, and the
  # locally bundled .wasm fails WebAssembly.instantiateStreaming.
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  access_log /dev/stdout;
  error_log /dev/stderr;
  sendfile on;

  server {
    # 0.0.0.0, unlike the logs sidecar's loopback bind: this one is the
    # public site. Unprivileged image, so the port must be >1024.
    listen 0.0.0.0:8080;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime configuration, rendered from PHASE_* environment variables at
    # container start by /docker-entrypoint.d/40-phase-web-config.sh rather
    # than served from the bundle's placeholder of the same path. This is what
    # lets ONE generic image be pointed at any server without a rebuild: the
    # SPA reads it at startup and falls back to its build-time default when it
    # is absent or empty. Under /tmp because that is the one path that stays
    # writable on a read-only root filesystem.
    location = /config.js {
      root /tmp/phase-web;
      # =404 rather than falling through to the SPA fallback below: without
      # it a missing config.js returns index.html as text/html, which the
      # nosniff header then blocks on MIME grounds — a failure that reads as
      # a MIME error instead of a missing file.
      try_files /config.js =404;
      add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # A missing service worker must 404, never fall through to HTML.
    location = /sw.js {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Content-addressed filenames: safe to cache forever, and `immutable`
    # skips revalidation even on reload. Mirrors
    # client/deploy/cloudflare-pages/_headers.
    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Entry points that decide which bundle the user lands on. A stale copy
    # strands them on an old build until a manual hard refresh.
    location ~ ^/(index\.html|registerSW\.js|manifest\.webmanifest|workbox-[^/]+\.js)$ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # The client is a BrowserRouter with real history paths, so every deep
    # link and every reload off / must resolve to the app shell. No server
    # endpoint is routed here, so this cannot shadow one.
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
  }
}
