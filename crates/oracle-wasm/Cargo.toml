[package]
name = "oracle-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Standalone Oracle compatibility checks without a card database or game session"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
engine = { package = "phase-engine", path = "../engine" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
wasm-bindgen = "=0.2.127"
getrandom = { version = "0.3", features = ["wasm_js"] }

# Isolated like broker-wasm: this cannot change the game/client binding schema.
[workspace]
resolver = "2"
