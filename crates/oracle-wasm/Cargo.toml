[package]
name = "oracle-wasm"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Standalone Oracle compatibility checks without a card database or game session"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
engine = { package = "phase-engine", path = "../engine" }
serde = { workspace = true }
serde_json = "1"
wasm-bindgen = "=0.2.127"
getrandom = { version = "0.3", features = ["wasm_js"] }
