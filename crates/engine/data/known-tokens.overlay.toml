# Hand-authored token presets that `tokens-gen` merges into
# `crates/engine/data/known-tokens.toml` and never rewrites.
#
# `known-tokens.toml` is regenerated whole from MTGJSON per-set token data on
# every run, so a row MTGJSON has no source for cannot survive in it — that is
# the defect this file exists to fix. A row belongs here when a card's Oracle
# text creates a named token that MTGJSON has not yet published set token data
# for, which happens for every set during its preview season.
#
# Each row is an ordinary `[[token]]` in the same shape as the generated
# catalog. Two obligations:
#
#   * `id` is a placeholder, not an MTGJSON token uuid — use a deterministic
#     uuid5 namespaced off the creating card's Scryfall oracle_id, so the row
#     sorts and dedupes safely. The real MTGJSON entry will carry a different
#     uuid, which is why `id` alone cannot express supersession.
#   * `source_card_refs` MUST carry an entry with the creating card's real
#     `scryfall_oracle_id`. `tokens-gen` refuses a row without one, because
#     that reference is what lets MTGJSON's own entry supersede this row: a
#     generated preset supersedes a row when it shares the row's `id`, or
#     shares its set, its token name and that source card.
#
# When `tokens-gen` reports a row superseded, delete the row from this file —
# MTGJSON now ships the token and the generated preset is authoritative. The
# committed-overlay test in `token_presets.rs` reds until you do.
#
# An empty overlay is this hatch's healthy steady state, not a defect: every
# row is deleted once MTGJSON ships the token it stood in for, so it holds no
# rows between preview seasons. Leave `token = []` in place then — the file is
# still a catalog file, and the catalog shape requires the `token` key. The
# tests tolerate an empty overlay and keep `merge_overlay` under test with a
# catalog-derived probe; replace the line with `[[token]]` rows to add one.

token = []
