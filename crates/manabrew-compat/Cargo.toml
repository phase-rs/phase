[package]
name = "manabrew-compat"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
engine = { path = "../engine" }
serde = { workspace = true }
serde_json = "1"

[dev-dependencies]
# The test module reaches `engine::game::zones`, which is `pub` only under
# `cfg(any(test, feature = "test-support"))`. Without this the crate's tests
# fail to compile with E0603 under `cargo test -p manabrew-compat`, and their
# CI coverage is incidental: `cargo nextest run --workspace` only builds them
# because phase-ai / server-core / engine-wasm happen to enable the same
# feature from *their* dev-dependencies. Declaring it here makes the crate
# self-sufficient, matching those three manifests.
engine = { path = "../engine", features = ["test-support"] }
pretty_assertions = "1"
