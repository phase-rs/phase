rule = "701.15b"
section = 701
title = "Keyword Actions - CR 701.15b"
status = "skeleton"
text = "Goaded is a designation a permanent can have. A goaded creature attacks each combat if able and attacks a player other than the controller of the permanent, spell, or ability that caused it to be goaded if able. Goaded is neither an ability nor part of the permanent’s copiable values."
