rule = "701.65a"
section = 701
title = "Keyword Actions - CR 701.65a"
status = "skeleton"
text = "Certain spells and abilities instruct a player to airbend one or more permanents and/or spells. To do so, that player exiles those objects. For each card exiled this way, for as long as it remains exiled, its owner may cast it by paying {2} rather than paying its mana cost."
