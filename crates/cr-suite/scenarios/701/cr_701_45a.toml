rule = "701.45a"
section = 701
title = "Keyword Actions - CR 701.45a"
status = "skeleton"
text = "Assemble is a keyword action in the Unstable set that puts Contraptions onto the battlefield. Outside of silver-bordered cards, only one card (Steamflogger Boss) refers to assembling a Contraption. Cards and mechanics from the Unstable set aren’t included in these rules. See the Unstable FAQ for more information."
