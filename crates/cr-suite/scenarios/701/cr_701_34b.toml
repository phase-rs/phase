rule = "701.34b"
section = 701
title = "Keyword Actions — CR 701.34b"
status = "skeleton"
text = "In a Two-Headed Giant game, poison counters are shared by the team. If more than one player on a team is chosen this way, only one of those players can be given an additional poison counter. The player who proliferates chooses which player that is. See rule 810, “Two-Headed Giant Variant.”"
