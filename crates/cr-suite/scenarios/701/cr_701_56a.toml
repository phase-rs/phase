rule = "701.56a"
section = 701
title = "Keyword Actions - CR 701.56a"
status = "skeleton"
text = "To time travel means to choose any number of permanents you control with one or more time counters on them and/or suspended cards you own in exile with one or more time counters on them and, for each of those objects, put a time counter on it or remove a time counter from it. See rule 702.62, “Suspend.”"
