rule = "701.43d"
section = 701
title = "Keyword Actions - CR 701.43d"
status = "skeleton"
text = "“You may exert [this creature] as it attacks” is an optional cost to attack (see rule 508.1g). Some objects with this static ability have a triggered ability that triggers “when you do” printed in the same paragraph. These abilities are linked. (See rule 607.2h.)"
