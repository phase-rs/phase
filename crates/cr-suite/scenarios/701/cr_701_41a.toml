title = "Keyword Actions - CR 701.41a"
status = "skeleton"
text = "“Support N” on a permanent means “Put a +1/+1 counter on each of up to N other target creatures.” “Support N” on an instant or sorcery spell means “Put a +1/+1 counter on each of up to N target creatures.”"
