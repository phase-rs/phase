rule = "614.1"
section = 614
status = "deferred"
text = "Some continuous effects are replacement effects. Such effects watch for a particular event that would happen and completely or partially replace that event with a different event."
notes = "Deferred: needs a replacement source (e.g. an enters-tapped permanent or a damage-replacement) plus the event it replaces. Once wired, assert the downstream state (e.g. creature entered tapped, or reduced damage)."
