rule = "704.5j"
section = 704
status = "deferred"
text = "If two or more legendary permanents with the same name are controlled by the same player, that player chooses one of them, and the rest are put into their owners' graveyards. This is called the legend rule."
notes = "Deferred: needs two legendary permanents with the same name under one controller plus the resulting choice. Once legendary setup + the SBA choice are wired, assert one copy remains on the battlefield and the other is in the graveyard."
