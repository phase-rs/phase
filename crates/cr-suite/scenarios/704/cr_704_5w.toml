rule = "704.5w"
section = 704
title = "State-Based Actions - CR 704.5w"
status = "skeleton"
text = "If a battle has no player in the game designated as its protector and no attacking creatures are currently attacking that battle, that battle’s controller chooses an appropriate player to be its protector based on its battle type. If no player can be chosen this way, the battle is put into its owner’s graveyard. See rule 310, “Battles.”"
