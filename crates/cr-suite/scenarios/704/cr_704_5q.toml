rule = "704.5q"
section = 704
status = "deferred"
text = "If a permanent has both a +1/+1 counter and a -1/-1 counter on it, N +1/+1 and N -1/-1 counters are removed from it, where N is the smaller of the number of +1/+1 and -1/-1 counters on it."
notes = "CR 704.5q is +1/+1 / -1/-1 counter annihilation. Deferred: needs counter setup on a permanent plus a counter-count read assertion. Once wired, put 2 +1/+1 and 3 -1/-1, run SBAs, and assert 0 +1/+1 and 1 -1/-1 remain."
