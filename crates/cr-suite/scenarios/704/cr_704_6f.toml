title = "State-Based Actions - CR 704.6f"
status = "skeleton"
text = "In a Planechase game, if a phenomenon card is face up in the command zone, and it isn’t the source of a triggered ability that has triggered but not yet left the stack, the planar controller planeswalks. See rule 901, “Planechase.”"
