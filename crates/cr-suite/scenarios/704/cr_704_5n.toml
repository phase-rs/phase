rule = "704.5n"
section = 704
status = "deferred"
text = "If an Equipment or Fortification is attached to an illegal permanent or to a player, it becomes unattached from that permanent or player. It remains on the battlefield."
notes = "CR 704.5n is the illegal-attachment SBA (NOT counter annihilation, which is CR 704.5q). Deferred: needs Equipment attach primitives to create the illegal attachment; then assert the Equipment stays on the battlefield but unattached."
