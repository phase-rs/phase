rule = "601.2"
section = 601
title = "Casting Spells — CR 601.2"
status = "executable"
text = "To cast a spell is to take it from where it is (usually the hand), put it on the stack, and pay its costs, so that it will eventually resolve and have its effect."
notes = "Production path: cast Lightning Bolt but do NOT resolve it. The spell is on the stack (not resolved), so the target's life is unchanged and the game is not over. Discriminates a cast-only step from a cast-and-resolve step."

