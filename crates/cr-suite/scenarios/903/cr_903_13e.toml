rule = "903.13e"
section = 903
title = "Commander — CR 903.13e"
status = "skeleton"
text = "After the draft is complete, the cards a player drafted become that player’s card pool. If the draft contained draft boosters from Commander Legends or Commander Masters, each player may add up to two cards named The Prismatic Piper to their card pool, but only if those cards are used as the player’s commander(s). If the draft contained draft boosters from Commander Legends: Battle for Baldur’s Gate®, each player may add up to two cards named Faceless One to their card pool, but only if those cards are used as the player’s commander(s)."
