rule = "104.1"
section = 104
title = "Ending the Game — CR 104.1"
status = "executable"
text = "A game ends immediately when a player wins, when the game is a draw, or when the game is restarted."
notes = "Win path only (via SBA after life loss): cast Lightning Bolt (Effect::DealDamage) at a player on 3 life → resolve → CR 704.5a takes player 1 to 0 → the sole remaining player wins and the game ends. The draw and restart paths of CR 104.1 are covered separately (see cr_104_1_draw.toml)."

