rule = "119.2"
section = 119
status = "deferred"
text = "Damage dealt to a player normally causes that player to lose that much life."
notes = "The win-path variant of this (bolt to a player = life loss) is already covered executably by cr_704_5a / cr_405_1 (life 20 -> 17). This entry documents CR 119.2 itself; a non-lethal player-damage fixture asserting only the life delta is redundant with those, so it is left deferred to avoid duplicate coverage."
