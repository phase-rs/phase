rule = "119.3"
section = 119
status = "deferred"
text = "If an effect causes a player to gain life or lose life, that player's life total is adjusted accordingly."
notes = "Deferred: needs a production life-gain or direct life-loss effect (distinct from damage). The runner only has Lightning Bolt (damage). Once a gain-life / lose-life effect step exists, assert the adjusted player_life."
