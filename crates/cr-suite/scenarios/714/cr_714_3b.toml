rule = "714.3b"
section = 714
title = "Saga Cards — CR 714.3b"
status = "skeleton"
text = "Each Saga with read ahead has the intrinsic abilities “As this Saga enters, choose a number between one and this Saga’s final chapter number” and “This Saga enters with the chosen number of lore counters on it.” (See rule 702.155, “Read Ahead.”) These abilities create replacement effects (see rule 614.1c)."
