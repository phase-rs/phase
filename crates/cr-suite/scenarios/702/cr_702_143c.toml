rule = "702.143c"
section = 702
title = "Keyword Abilities - CR 702.143c"
status = "skeleton"
text = "If an effect refers to foretelling a card, it means performing the special action associated with a foretell ability. If an effect refers to a card or spell that was foretold, it means a card put in the exile zone as a result of the special action associated with a foretell ability, or a spell that was a foretold card before it was cast, even if it was cast for a cost other than a foretell cost."
