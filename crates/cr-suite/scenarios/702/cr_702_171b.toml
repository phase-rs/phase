rule = "702.171b"
section = 702
title = "Keyword Abilities - CR 702.171b"
status = "skeleton"
text = "Saddled is a designation that has no rules meaning other than to act as a marker that spells and abilities can identify. Only permanents can be or become saddled. Once a permanent has become saddled, it stays saddled until the end of the turn or it leaves the battlefield. Being saddled is not a part of the permanent’s copiable values."
