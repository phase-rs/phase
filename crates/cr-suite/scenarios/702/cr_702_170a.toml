rule = "702.170a"
section = 702
title = "Keyword Abilities - CR 702.170a"
status = "skeleton"
text = "Plot is a keyword ability that functions while the card with plot is in a player’s hand. “Plot [cost]” means “Any time you have priority during your main phase while the stack is empty, you may exile this card from your hand and pay [cost]. It becomes a plotted card.”"
