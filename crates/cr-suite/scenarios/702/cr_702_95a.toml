rule = "702.95a"
section = 702
title = "Keyword Abilities - CR 702.95a"
status = "skeleton"
text = "Soulbond is a keyword that represents two triggered abilities. “Soulbond” means “When this creature enters, if you control both this creature and another creature and both are unpaired, you may pair this creature with another unpaired creature you control for as long as both remain creatures on the battlefield under your control” and “Whenever another creature you control enters, if you control both that creature and this one and both are unpaired, you may pair that creature with this creature for as long as both remain creatures on the battlefield under your control.”"
