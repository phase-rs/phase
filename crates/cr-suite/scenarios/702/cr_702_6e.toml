rule = "702.6e"
section = 702
title = "Keyword Abilities — CR 702.6e"
status = "skeleton"
text = "“Equip planeswalker” is a variant of the equip ability. “Equip planeswalker [cost]” means “[Cost]: Attach this permanent to target planeswalker you control as though that planeswalker were a creature. Activate only as a sorcery.”"
