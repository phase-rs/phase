rule = "702.159a"
section = 702
title = "Keyword Abilities - CR 702.159a"
status = "skeleton"
text = "Visit is a keyword ability found on Attraction cards (see rule 717). “Visit — [Effect]” means “Whenever you roll to visit your Attractions, if the result is equal to a number that is lit up on this Attraction, [effect].” See rule 701.52, “Roll to Visit Your Attractions.”"
