rule = "702.38a"
section = 702
title = "Keyword Abilities — CR 702.38a"
status = "skeleton"
text = "Amplify is a static ability. “Amplify N” means “As this object enters, reveal any number of cards from your hand that share a creature type with it. This permanent enters with N +1/+1 counters on it for each card revealed this way. You can’t reveal this card or any other cards that are entering the battlefield at the same time as this card.”"
