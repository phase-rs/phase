rule = "702.137a"
section = 702
title = "Keyword Abilities — CR 702.137a"
status = "skeleton"
text = "Spectacle is a static ability that functions on the stack. “Spectacle [cost]” means “You may pay [cost] rather than pay this spell’s mana cost if an opponent lost life this turn.” Casting a spell for its spectacle cost follows the rules for paying alternative costs in rules 601.2b and 601.2f–h."
