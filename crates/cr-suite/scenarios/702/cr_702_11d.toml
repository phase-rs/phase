rule = "702.11d"
section = 702
title = "Keyword Abilities - CR 702.11d"
status = "skeleton"
text = "“Hexproof from [quality]” is a variant of the hexproof ability. “Hexproof from [quality]” on a permanent means “This permanent can’t be the target of [quality] spells your opponents control or abilities your opponents control from [quality] sources.” A “hexproof from [quality]” ability is a hexproof ability."
