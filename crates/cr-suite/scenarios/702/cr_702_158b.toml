rule = "702.158b"
section = 702
title = "Keyword Abilities - CR 702.158b"
status = "skeleton"
text = "A sector designation is a designation a permanent can have. The sector designations are alpha sector, beta sector, and gamma sector. Only permanents can have a sector designation. Once a permanent gets a sector designation, it keeps it until no player controls a permanent with space sculptor or an ability whose source has space sculptor. A sector designation is not part of the permanent’s copiable values."
