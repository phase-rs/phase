rule = "702.59a"
section = 702
title = "Keyword Abilities — CR 702.59a"
status = "skeleton"
text = "Recover is a triggered ability that functions only while the card with recover is in a player’s graveyard. “Recover [cost]” means “When a creature is put into your graveyard from the battlefield, you may pay [cost]. If you do, return this card from your graveyard to your hand. Otherwise, exile this card.”"
