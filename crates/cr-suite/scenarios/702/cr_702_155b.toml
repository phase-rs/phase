title = "Keyword Abilities - CR 702.155b"
status = "skeleton"
text = "Each Saga with read ahead has the intrinsic abilities “As this Saga enters, choose a number between one and this Saga’s final chapter number” and “This Saga enters with the chosen number of lore counters on it.” See rule 714.3b."
