rule = "702.26e"
section = 702
title = "Keyword Abilities - CR 702.26e"
status = "skeleton"
text = "If a continuous effect generated by the resolution of a spell or ability modifies the characteristics or changes the controller of any objects, a phased-out permanent won’t be included in the set of affected objects. This includes continuous effects that reference the permanent specifically, unless they also specifically refer to the permanent as phased out."
