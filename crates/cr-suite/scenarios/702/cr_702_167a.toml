rule = "702.167a"
section = 702
title = "Keyword Abilities — CR 702.167a"
status = "skeleton"
text = "Craft represents an activated ability. It is written as “Craft with [materials] [cost],” where [materials] is a description of one or more objects. It means “[Cost], Exile this permanent, Exile [materials] from among permanents you control and/or cards in your graveyard: Return this card to the battlefield transformed under its owner’s control. Activate only as a sorcery.”"
