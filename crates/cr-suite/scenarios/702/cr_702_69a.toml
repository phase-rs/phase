rule = "702.69a"
section = 702
title = "Keyword Abilities - CR 702.69a"
status = "skeleton"
text = "Gravestorm is a triggered ability that functions on the stack. “Gravestorm” means “When you cast this spell, copy it for each permanent that was put into a graveyard from the battlefield this turn. If the spell has any targets, you may choose new targets for any of the copies.”"
