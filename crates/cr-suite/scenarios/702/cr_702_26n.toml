rule = "702.26n"
section = 702
title = "Keyword Abilities - CR 702.26n"
status = "skeleton"
text = "In a multiplayer game, game rules may cause a phased-out permanent to leave the game or to be exiled once a player leaves the game. (See rules 800.4a and 800.4c.) If a phased-out permanent phased out under the control of a player who has left the game, that permanent phases in during the next untap step after that player’s next turn would have begun."
