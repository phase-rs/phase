rule = "702.63a"
section = 702
title = "Keyword Abilities - CR 702.63a"
status = "skeleton"
text = "Vanishing is a keyword that represents three abilities. “Vanishing N” means “This permanent enters with N time counters on it,” “At the beginning of your upkeep, if this permanent has a time counter on it, remove a time counter from it,” and “When the last time counter is removed from this permanent, sacrifice it.”"
