rule = "702.112b"
section = 702
title = "Keyword Abilities — CR 702.112b"
status = "skeleton"
text = "Renowned is a designation that has no rules meaning other than to act as a marker that the renown ability and other spells and abilities can identify. Only permanents can be or become renowned. Once a permanent becomes renowned, it stays renowned until it leaves the battlefield. Renowned is neither an ability nor part of the permanent’s copiable values."
