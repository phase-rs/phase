rule = "702.33a"
section = 702
title = "Keyword Abilities - CR 702.33a"
status = "skeleton"
text = "Kicker is a static ability that functions while the spell with kicker is on the stack. “Kicker [cost]” means “You may pay an additional [cost] as you cast this spell.” Paying a spell’s kicker cost(s) follows the rules for paying additional costs in rules 601.2b and 601.2f–h."
