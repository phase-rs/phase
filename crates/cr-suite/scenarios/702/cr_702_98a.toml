title = "Keyword Abilities — CR 702.98a"
status = "skeleton"
text = "Unleash is a keyword that represents two static abilities. “Unleash” means “You may have this permanent enter with an additional +1/+1 counter on it” and “This permanent can’t block as long as it has a +1/+1 counter on it.”"
