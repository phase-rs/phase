rule = "702.124j"
section = 702
title = "Keyword Abilities — CR 702.124j"
status = "skeleton"
text = "“Partner with [name]” represents two abilities. It means “You may designate two legendary cards as your commander rather than one if each has a ‘partner with [name]’ ability with the other’s name” and “When this permanent enters, target player may search their library for a card named [name], reveal it, put it into their hand, then shuffle.”"
