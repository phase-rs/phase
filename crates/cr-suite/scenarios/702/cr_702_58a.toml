rule = "702.58a"
section = 702
title = "Keyword Abilities — CR 702.58a"
status = "skeleton"
text = "Graft represents both a static ability and a triggered ability. “Graft N” means “This permanent enters with N +1/+1 counters on it” and “Whenever another creature enters, if this permanent has a +1/+1 counter on it, you may move a +1/+1 counter from this permanent onto that creature.”"
