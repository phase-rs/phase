rule = "702.146a"
section = 702
title = "Keyword Abilities — CR 702.146a"
status = "skeleton"
text = "Disturb is an ability found on the front face of some double-faced cards (see rule 712, “Double-Faced Cards”). “Disturb [cost]” means “You may cast this card transformed from your graveyard by paying [cost] rather than its mana cost.” See rule 712.8c."
