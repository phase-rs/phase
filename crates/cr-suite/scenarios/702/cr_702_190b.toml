title = "Keyword Abilities - CR 702.190b"
status = "skeleton"
text = "A permanent spell whose sneak cost was paid enters the battlefield tapped and attacking (see rule 506.3a). It will be attacking the same player, planeswalker, or battle as the creature that was returned to its owner’s hand to pay the sneak cost of the spell that became that permanent."
