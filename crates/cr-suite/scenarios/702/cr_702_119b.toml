rule = "702.119b"
section = 702
title = "Keyword Abilities — CR 702.119b"
status = "skeleton"
text = "Emerge from [quality] is a variant of emerge. “Emerge from [quality] [cost]” means “You may cast this spell by paying [cost] and sacrificing a [quality] permanent rather than paying its mana cost” and “If you pay this spell’s emerge cost, its total cost is reduced by an amount of generic mana equal to the sacrificed permanent’s mana value.”"
