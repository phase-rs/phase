rule = "702.43a"
section = 702
title = "Keyword Abilities — CR 702.43a"
status = "skeleton"
text = "Modular represents both a static ability and a triggered ability. “Modular N” means “This permanent enters with N +1/+1 counters on it” and “When this permanent is put into a graveyard from the battlefield, you may put a +1/+1 counter on target artifact creature for each +1/+1 counter on this permanent.”"
