rule = "702.51a"
section = 702
title = "Keyword Abilities - CR 702.51a"
status = "skeleton"
text = "Convoke is a static ability that functions while the spell with convoke is on the stack. “Convoke” means “For each colored mana in this spell’s total cost, you may tap an untapped creature of that color you control rather than pay that mana. For each generic mana in this spell’s total cost, you may tap an untapped creature you control rather than pay that mana.”"
