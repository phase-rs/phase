rule = "702.50a"
section = 702
title = "Keyword Abilities - CR 702.50a"
status = "skeleton"
text = "Epic represents two spell abilities, one of which creates a delayed triggered ability. “Epic” means “For the rest of the game, you can’t cast spells,” and “At the beginning of each of your upkeeps for the rest of the game, copy this spell except for its epic ability. If the spell has any targets, you may choose new targets for the copy.” See rule 707.10."
