rule = "702.190a"
section = 702
title = "Keyword Abilities - CR 702.190a"
status = "skeleton"
text = "Sneak is a keyword that represents a static ability that functions while the spell with sneak is on the stack. “Sneak [cost]” means “Any time you could cast an instant during your declare blockers step, you may cast this spell by paying [cost] and returning an unblocked creature you control to its owner’s hand rather than paying this spell’s mana cost.”"
