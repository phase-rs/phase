rule = "702.81a"
section = 702
title = "Keyword Abilities — CR 702.81a"
status = "skeleton"
text = "Retrace is a static ability that functions while the card with retrace is in a player’s graveyard. “Retrace” means “You may cast this card from your graveyard by discarding a land card as an additional cost to cast it.” Casting a spell using its retrace ability follows the rules for paying additional costs in rules 601.2b and 601.2f–h."
