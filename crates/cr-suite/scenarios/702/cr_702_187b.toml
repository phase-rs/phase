rule = "702.187b"
section = 702
title = "Keyword Abilities - CR 702.187b"
status = "skeleton"
text = "“Mayhem [cost]” means “As long as you discarded this card this turn, you may cast it from your graveyard by paying [cost] rather than paying its mana cost.” Casting a spell using its mayhem ability follows the rules for paying alternative costs in rules 601.2b and 601.2f–h."
