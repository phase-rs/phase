rule = "702.143e"
section = 702
title = "Keyword Abilities — CR 702.143e"
status = "skeleton"
text = "If a player owns multiple foretold cards in exile, they must ensure that those cards can be easily differentiated from each other and from any other face-down cards in exile which that player owns. This includes knowing both the order in which those cards were put into exile and any foretell costs other than their printed foretell costs those cards may have."
