rule = "702.145e"
section = 702
title = "Keyword Abilities - CR 702.145e"
status = "skeleton"
text = "Nightbound is found on the back faces of some double-faced cards and represents two static abilities. “Nightbound” means “As it becomes day, if this permanent is back face up, transform it” and “This permanent can’t transform except due to its nightbound ability.”"
