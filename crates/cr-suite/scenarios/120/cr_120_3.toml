rule = "120.3"
section = 120
title = "Damage — CR 120.3"
status = "deferred"
text = "Damage marked on a creature remains until it's removed or the creature leaves the battlefield."
notes = "Needs a production nonlethal DealDamage path (Lightning Bolt is always 3). Defer until the runner can cast a 1-damage Effect::DealDamage spell without direct GameState mutation."
