[package]
name = "draft-wasm"
version.workspace = true
edition = "2021"
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
draft-core = { path = "../draft-core" }
engine = { path = "../engine", package = "phase-engine" }
phase-ai = { path = "../phase-ai" }
# LLM drafters (opt-in). The `draft` feature adds the pack/pool prompt renderer
# on top of the shared provider wire formats.
phase-llm = { path = "../phase-llm", features = ["draft"] }
rand = "0.9"
rand_chacha = "0.9"
wasm-bindgen = "0.2.114"
serde = "1"
serde_json = "1"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.3", features = ["wasm_js"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
